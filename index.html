<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Springfield Heroes - Cloud Edition</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #ffd900; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* LOGIN OBRAZOVKA */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffd900; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: white; padding: 30px; border-radius: 15px; border: 5px solid #000; text-align: center; }
        input { padding: 10px; margin: 10px; border: 2px solid #333; border-radius: 5px; width: 200px; display: block; }
        
        /* HRA */
        #game-screen { display: none; width: 100%; height: 100%; }
        .map-container { flex: 1; background: url('mesto.png') no-repeat center center; background-size: cover; border-right: 5px solid #000; }
        .sidebar { width: 320px; background: white; padding: 20px; display: flex; flex-direction: column; box-shadow: -10px 0 20px rgba(0,0,0,0.2); }
        
        .stats { background: #eee; padding: 15px; border-radius: 10px; border: 2px solid #333; margin-bottom: 20px; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        button { background: #008cff; color: white; border: 3px solid #000; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005fbb; }
        
        #log { background: #333; color: #0f0; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-top: auto; border: 2px solid #000; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Springfield Heroes</h1>
            <input type="text" id="username" placeholder="Meno (Lubo, Karol, Peter)">
            <input type="password" id="password" placeholder="Heslo">
            <button onclick="checkLogin()" style="background: #000;">VSTÚPIŤ</button>
            <p id="error-msg" style="color: red; display: none;">Chybné meno alebo heslo!</p>
        </div>
    </div>

    <div id="game-screen">
        <div class="map-container"></div>
        <div class="sidebar">
            <h2 id="p-name">Hrdina</h2>
            <div class="stats">
                <div>❤️ HP: <span id="hp">---</span></div>
                <div>💪 Sila: <span id="str">---</span></div>
                <div>💰 Goldy: <span id="gold">---</span></div>
            </div>
            <div class="actions">
                <button onclick="playQuest()">Hospoda (Quest +50g)</button>
                <button onclick="train()">Elektráreň (Tréning -10g)</button>
                <button onclick="buyArmor()">Obchod (Brnenie -150g)</button>
            </div>
            <div id="log">Pripájanie k cloudu...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tvoja konfigurácia
        const firebaseConfig = {
            apiKey: "AIzaSyBco-l3gRLUA9y4aPmYuYnRTj_gkZJGo4E",
            authDomain: "springfield-heroes.firebaseapp.com",
            projectId: "springfield-heroes",
            storageBucket: "springfield-heroes.firebasestorage.app",
            messagingSenderId: "601449864337",
            appId: "1:601449864337:web:d98c8e66c5f27e756e7330"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let hero = { name: "", hp: 150, str: 15, gold: 100 };

        // LOGIN FUNKCIA
        window.checkLogin = async function() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const valid = { "Lubo":"123Lubo", "Karol":"123Karol", "Peter":"123Peter" };

            if (valid[user] && valid[user] === pass) {
                const docRef = doc(db, "players", user);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    hero = docSnap.data();
                    log("Vitaj späť! Dáta načítané.");
                } else {
                    hero.name = user;
                    await setDoc(docRef, hero);
                    log("Nový hrdina vytvorený v cloude.");
                }
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('p-name').innerText = hero.name;
                updateUI();
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        };

        // UKLADANIE
        async function save() {
            const docRef = doc(db, "players", hero.name);
            await updateDoc(docRef, hero);
            log("💾 Automaticky uložené.");
        }

        // HERNÉ AKCIE
        window.playQuest = function() { hero.gold += 50; log("Quest hotový! +50g"); updateUI(); save(); };
        window.train = function() { 
            if(hero.gold >= 10) { hero.gold -= 10; hero.str += 2; log("Tréning v elektrárni! Sila +2"); } 
            else { log("Málo goldov!"); }
            updateUI(); save(); 
        };
        window.buyArmor = function() { 
            if(hero.gold >= 150) { hero.gold -= 150; hero.hp += 50; log("Nové brnenie kúpené!"); } 
            updateUI(); save(); 
        };

        function updateUI() {
            document.getElementById('hp').innerText = hero.hp;
            document.getElementById('str').innerText = hero.str;
            document.getElementById('gold').innerText = hero.gold;
        }

        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += "><br>" + msg;
            l.scrollTop = l.scrollHeight;
        }
    </script>
</body>
</html>
