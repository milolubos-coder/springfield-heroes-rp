<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title>Springfield Heroes - Code Built World</title>
    
    <style>
        /* ============================================================
           🎨 1. GLOBÁLNE CSS FORMÁTOVANIE
           ============================================================
        */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #4facfe; 
            display: flex; 
            flex-direction: row;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            color: #333;
        }

        /* ============================================================
           🔒 2. LOGIN SYSTÉM (PRIHLÁSENIE)
           ============================================================
        */
        #login-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #ffd900 0%, #ffb300 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 10000; 
            transition: opacity 1s ease;
        }

        .login-box { 
            background-color: #ffffff; 
            padding-top: 60px;
            padding-bottom: 60px;
            padding-left: 50px;
            padding-right: 50px;
            border-radius: 40px; 
            border-width: 12px;
            border-style: solid;
            border-color: #000000; 
            text-align: center; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            width: 550px;
            max-width: 95%;
        }

        .login-box h1 { 
            font-size: 3.8em; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            color: #000;
        }

        .login-box input { 
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 15px;
            padding-right: 15px;
            margin-top: 10px;
            margin-bottom: 20px; 
            border-width: 6px;
            border-style: solid;
            border-color: #333333; 
            border-radius: 18px; 
            width: 100%; 
            display: block; 
            font-size: 1.4em;
            text-align: center;
            outline: none;
        }

        .btn-login-action { 
            background-color: #000000; 
            color: #ffffff; 
            padding-top: 22px; 
            padding-bottom: 22px;
            border: none; 
            border-radius: 18px; 
            cursor: pointer; 
            font-weight: 900; 
            width: 100%; 
            font-size: 1.6em; 
            margin-top: 20px;
            text-transform: uppercase;
            transition: transform 0.2s ease;
        }

        .btn-login-action:hover {
            transform: scale(1.05);
            background-color: #222;
        }

        /* ============================================================
           🗺️ 3. DYNAMICKÝ SVET (VYGENEROVANÝ KÓDOM)
           ============================================================
        */
        #game-screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: row;
        }

        .world-viewport { 
            flex: 1; 
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            position: relative; 
            overflow: hidden; 
            border-right-width: 15px;
            border-right-style: solid;
            border-right-color: #000;
        }

        /* ZEM A TRÁVA */
        .landscape-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background-color: #7ed321;
            z-index: 1;
            border-top: 5px solid #5ca316;
        }

        /* CESTA CEZ CELÉ MESTO (SVG) */
        .road-system {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* OBLAKY */
        .cloud-node {
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 100px; 
            filter: blur(8px); 
            z-index: 5;
        }
        .cloud-node::before, .cloud-node::after {
            content: ''; 
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.9); 
            border-radius: 50%;
        }
        .cloud-node::before { width: 90px; height: 90px; top: -45px; left: 30px; }
        .cloud-node::after { width: 110px; height: 110px; top: -55px; left: 70px; }

        @keyframes driftClouds {
            from { left: -400px; }
            to { left: 100%; }
        }

        /* 🏭 JADROVÁ ELEKTRÁREŇ (CSS ART) */
        .b-powerplant {
            position: absolute;
            top: 15%;
            right: 8%;
            width: 320px;
            height: 220px;
            background-color: #9b9b9b;
            border: 6px solid #000;
            z-index: 10;
            cursor: help;
        }

        .tower-cooling {
            position: absolute;
            top: -140px;
            width: 80px;
            height: 140px;
            background-color: #ccc;
            border: 5px solid #000;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }

        .smoke-particle {
            position: absolute;
            top: -160px;
            width: 50px;
            height: 50px;
            background-color: rgba(200, 200, 200, 0.6);
            border-radius: 50%;
            filter: blur(10px);
            animation: riseSmoke 4s infinite linear;
        }

        @keyframes riseSmoke {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-200px) scale(4); opacity: 0; }
        }

        /* 🍺 HOSPODA U OČKA (CSS ART) */
        .b-pub {
            position: absolute;
            bottom: 15%;
            left: 5%;
            width: 280px;
            height: 200px;
            background-color: #8b4513;
            border: 7px solid #000;
            z-index: 10;
            cursor: pointer;
        }

        .pub-neon {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #00ffcc;
            font-weight: 900;
            font-size: 1.4em;
            text-shadow: 0 0 15px #00ffcc;
            animation: neonPulse 1.5s infinite alternate;
        }

        @keyframes neonPulse {
            from { opacity: 1; filter: brightness(1.2); }
            to { opacity: 0.6; filter: brightness(0.8); }
        }

        /* 🛒 KWIK-E-MART (CSS ART) */
        .b-shop {
            position: absolute;
            top: 45%;
            left: 30%;
            width: 240px;
            height: 160px;
            background-color: #ff3e3e;
            border: 6px solid #000;
            z-index: 10;
            cursor: pointer;
        }

        /* 👤 AVATARY HRÁČOV */
        .player-sprite {
            position: absolute;
            width: 74px;
            height: 74px;
            z-index: 500;
            transition-property: left, top;
            transition-duration: 1s;
            transition-timing-function: ease-in-out;
            pointer-events: none;
        }

        .sprite-img {
            width: 100%;
            height: 100%;
            background-image: url('barbar.png');
            background-size: contain;
            background-repeat: no-repeat;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.4));
        }

        .sprite-tag {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #000;
            color: #fff;
            padding-left: 12px;
            padding-right: 12px;
            padding-top: 5px;
            padding-bottom: 5px;
            border-radius: 10px;
            border-width: 3px;
            border-style: solid;
            border-color: #ffd900;
            font-weight: 900;
            font-size: 14px;
            white-space: nowrap;
        }

        /* 🚌 DOPRAVA */
        .city-bus {
            position: absolute;
            bottom: 25%;
            width: 110px;
            height: 55px;
            background-color: #f1c40f;
            border: 4px solid #000;
            border-radius: 8px;
            z-index: 50;
            animation: driveAcross 20s linear infinite;
        }

        @keyframes driveAcross {
            from { left: -150px; }
            to { left: 110%; }
        }

        /* ============================================================
           🖥️ 4. OVLÁDACÍ SIDEBAR
           ============================================================
        */
        .panel-sidebar { 
            width: 440px; 
            background-color: #ffffff; 
            padding-left: 35px; 
            padding-right: 35px; 
            padding-top: 25px;
            padding-bottom: 25px;
            display: flex; 
            flex-direction: column; 
            box-shadow: -20px 0 60px rgba(0,0,0,0.5); 
            overflow-y: auto;
            z-index: 2000;
        }

        .panel-sidebar h2 { 
            font-size: 2.5em; 
            text-align: center;
            border-bottom: 6px solid #ffd900;
            padding-bottom: 10px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .stats-grid { 
            background-color: #f2f2f2; 
            padding: 25px; 
            border-radius: 30px; 
            border: 6px solid #000; 
            margin-bottom: 30px; 
        }

        .stat-entry { 
            display: flex; 
            justify-content: space-between; 
            font-size: 1.8em; 
            font-weight: 900; 
            margin: 10px 0; 
        }

        .stat-val { color: #008cff; }

        /* 📜 CHAT A LOG */
        #game-log { 
            background-color: #111111; 
            color: #00ff00; 
            padding: 20px; 
            height: 300px; 
            overflow-y: auto; 
            font-family: 'Consolas', monospace; 
            font-size: 15px; 
            border: 6px solid #000; 
            border-radius: 20px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .chat-box { 
            display: flex; 
            gap: 10px; 
        }

        .chat-box input { 
            flex: 1; 
            padding: 15px; 
            border: 4px solid #000; 
            border-radius: 12px; 
            font-size: 1.1em;
        }

        .btn-send-chat { 
            padding-left: 20px;
            padding-right: 20px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Springfield RPG</h1>
            <input type="text" id="login-user" placeholder="Meno (Lubo, Karol, Peter)">
            <input type="password" id="login-pass" placeholder="Tvoje heslo">
            <button class="btn-login-action" onclick="tryLogin()">VSTÚPIŤ DO SVETA</button>
            <p id="error-txt" style="color:red; display:none; margin-top:20px; font-weight:bold;">Chybné údaje!</p>
        </div>
    </div>

    <div id="game-screen">
        
        <div class="world-viewport" id="game-map" onclick="requestMovement(event)">
            <div class="landscape-ground"></div>
            
            <svg class="road-system" viewBox="0 0 1200 800">
                <path d="M-50,600 Q400,600 600,400 T1250,200" stroke="#444" stroke-width="100" fill="none" />
                <path d="M-50,600 Q400,600 600,400 T1250,200" stroke="#fff" stroke-width="5" stroke-dasharray="30,30" fill="none" />
            </svg>

            <div class="cloud-node" style="width:180px;height:60px;top:5%;animation:driftClouds 40s linear infinite;"></div>
            <div class="cloud-node" style="width:250px;height:80px;top:20%;animation:driftClouds 70s linear infinite;animation-delay:-10s;"></div>
            <div class="cloud-node" style="width:130px;height:40px;top:10%;animation:driftClouds 55s linear infinite;animation-delay:-25s;"></div>

            <div class="b-pub" onclick="triggerLocation('hospoda')">
                <div class="pub-neon">U SMÄDNÉHO MEDVEĎA</div>
                <div style="position:absolute;bottom:0;width:100%;height:30%;background:#5d2e0c;"></div>
            </div>

            <div class="b-powerplant" onclick="triggerLocation('elektráreň')">
                <div style="background:#555;color:white;text-align:center;padding:10px;font-weight:bold;">SEKTOR 7-G</div>
                <div class="tower-cooling" style="left:50px;">
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle" style="animation-delay:1.5s;"></div>
                </div>
                <div class="tower-cooling" style="right:50px;">
                    <div class="smoke-particle" style="animation-delay:0.8s;"></div>
                </div>
            </div>

            <div class="b-shop" onclick="triggerLocation('obchod')">
                <div style="background:#000;color:#ffd900;text-align:center;padding:5px;font-weight:bold;">KWIK-E-MART</div>
            </div>

            <div class="city-bus"></div>

            <div id="mmo-sprites-layer"></div>
        </div>

        <div class="panel-sidebar">
            <h2 id="hero-display-name">Hrdina: ---</h2>
            
            <div class="stats-grid">
                <div class="stat-entry"><span>❤️ Zdravie:</span> <span id="val-hp" class="stat-val">---</span></div>
                <div class="stat-entry"><span>💪 Sila:</span> <span id="val-str" class="stat-val">---</span></div>
                <div class="stat-entry"><span>💰 Goldy:</span> <span id="val-gold" class="stat-val">---</span></div>
            </div>

            <div id="game-log">Pripájanie k hernému serveru...</div>

            <div class="chat-box">
                <input type="text" id="chat-input-field" placeholder="Povedz niečo ostatným..." onkeydown="if(event.key==='Enter') dispatchChat()">
                <button class="btn-send-chat" onclick="dispatchChat()">POSLAŤ</button>
            </div>
            
            <div style="background:#ffecec; padding:15px; border-radius:20px; border:5px solid #c0392b; margin-top:20px;">
                <h3 style="color:#c0392b; text-align:center; margin-bottom:10px;">⚔️ ARENA PvP</h3>
                <select id="victim-select" style="width:100%; padding:10px; border:3px solid #000; border-radius:10px; font-weight:bold; margin-bottom:10px;">
                    <option value="">-- Vyber obeť --</option>
                    <option value="Lubo">Lubo</option>
                    <option value="Karol">Karol</option>
                    <option value="Peter">Peter</option>
                </select>
                <button onclick="dispatchPvP()" style="width:100%; padding:12px; background:#c0392b; color:#fff; border:4px solid #000; border-radius:12px; font-weight:900; cursor:pointer;">ZAÚTOČIŤ!</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tvoja unikátna konfigurácia
        const firebaseConfig = {
            apiKey: "AIzaSyBco-l3gRLUA9y4aPmYuYnRT_gkZJGo4E",
            authDomain: "springfield-heroes.firebaseapp.com",
            projectId: "springfield-heroes",
            storageBucket: "springfield-heroes.firebasestorage.app",
            messagingSenderId: "601449864337",
            appId: "1:601449864337:web:d98c8e66c5f27e756e7330"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let hero = { name: "", hp: 150, str: 15, gold: 100, x: 50, y: 50 };
        let isMoving = false;

        // --- AUTENTIFIKÁCIA ---
        window.tryLogin = async function() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            const valid = { "Lubo":"123Lubo", "Karol":"123Karol", "Peter":"123Peter" };

            if (valid[u] && valid[u] === p) {
                hero.name = u;
                
                // Real-time MMO Player Listener
                onSnapshot(collection(db, "players"), (snap) => {
                    const layer = document.getElementById('mmo-sprites-layer');
                    layer.innerHTML = '';
                    snap.forEach(d => {
                        const data = d.data();
                        renderSprite(data);
                        if (data.name === hero.name) {
                            if (!isMoving && data.gold < hero.gold) writeLog(`🚨 ALERT: Bol si okradnutý o ${hero.gold - data.gold} goldov!`);
                            hero = data;
                            refreshUI();
                        }
                    });
                });

                // Real-time Chat Listener
                const q = query(collection(db, "chat"), orderBy("time", "desc"), limit(25));
                onSnapshot(q, s => {
                    s.docChanges().reverse().forEach(c => {
                        if (c.type === "added") writeLog(`[CHAT] ${c.doc.data().user}: ${c.doc.data().msg}`);
                    });
                });

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('hero-display-name').innerText = "Hrdina: " + u;
                writeLog("Vstúpil si do dynamického Springfieldu.");
            } else {
                document.getElementById('error-txt').style.display = 'block';
            }
        };

        // --- POHYB HRÁČA ---
        window.requestMovement = async function(e) {
            const m = document.getElementById('game-map');
            const r = m.getBoundingClientRect();
            hero.x = ((e.clientX - r.left) / r.width) * 100;
            hero.y = ((e.clientY - r.top) / r.height) * 100;
            
            isMoving = true;
            await updateDoc(doc(db, "players", hero.name), { x: hero.x, y: hero.y });
            setTimeout(() => isMoving = false, 800);
        };

        function renderSprite(p) {
            const layer = document.getElementById('mmo-sprites-layer');
            const div = document.createElement('div');
            div.className = 'player-sprite';
            div.style.left = `calc(${p.x}% - 37px)`;
            div.style.top = `calc(${p.y}% - 37px)`;
            div.innerHTML = `<div class="sprite-tag">${p.name}</div><div class="sprite-img"></div>`;
            layer.appendChild(div);
        }

        // --- LOKALITY A AKCIE ---
        window.triggerLocation = async function(type) {
            if (type === 'hospoda') { hero.gold += 50; writeLog("🍺 Očko ti podal pivo a 50 goldov."); }
            if (type === 'elektráreň') { 
                if(hero.gold >= 10) { hero.gold -= 10; hero.str += 2; writeLog("🏗️ Makal si s Homerom. Sila +2."); }
                else writeLog("❌ Nemáš 10 goldov na vstup!");
            }
            if (type === 'obchod') {
                if(hero.gold >= 150) { hero.gold -= 150; hero.hp += 50; writeLog("🛒 Apu ti predal brnenie. HP +50."); }
                else writeLog("❌ Apu: Na toto nemáš!");
            }
            isMoving = true;
            await updateDoc(doc(db, "players", hero.name), hero);
            setTimeout(() => isMoving = false, 1000);
        };

        // --- PvP SÚBOJ ---
        window.dispatchPvP = async function() {
            const target = document.getElementById('victim-select').value;
            if(!target || target === hero.name) return writeLog("Vyber platnú obeť!");
            
            const tRef = doc(db, "players", target);
            const tSnap = await getDoc(tRef);
            
            if(tSnap.exists()) {
                let tData = tSnap.data();
                if((hero.str + Math.random()*20) > (tData.str + Math.random()*20)) {
                    let loot = Math.floor(tData.gold * ((Math.floor(Math.random()*10)+1)/100));
                    if(loot < 1 && tData.gold > 0) loot = 1;
                    await updateDoc(tRef, { gold: tData.gold - loot });
                    hero.gold += loot;
                    writeLog(`✅ VÝHRA! Ukradol si ${loot}g hráčovi ${target}!`);
                    isMoving = true;
                    await updateDoc(doc(db, "players", hero.name), { gold: hero.gold });
                    setTimeout(() => isMoving = false, 1000);
                } else writeLog(`💀 PREHRA! ${target} ťa zmlátil.`);
            }
        };

        // --- CHAT A UI ---
        window.dispatchChat = async () => {
            const i = document.getElementById('chat-input-field');
            if (!i.value) return;
            await addDoc(collection(db, "chat"), { user: hero.name, msg: i.value, time: Date.now() });
            i.value = "";
        };

        function refreshUI() {
            document.getElementById('val-hp').innerText = hero.hp;
            document.getElementById('val-str').innerText = hero.str;
            document.getElementById('val-gold').innerText = hero.gold;
        }

        function writeLog(m) {
            const b = document.getElementById('game-log');
            b.innerHTML += `> ${m}<br>`;
            b.scrollTop = b.scrollHeight;
        }
    </script>
</body>
</html>
