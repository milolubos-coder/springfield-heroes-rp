<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title>Springfield Heroes - Real-time MMO Master</title>
    
    <style>
        /* ============================================================
           🎨 GLOBÁLNE FORMÁTOVANIE (CSS)
           ============================================================
        */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffd900; 
            display: flex; 
            flex-direction: row;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            color: #222;
        }

        /* ============================================================
           🔒 PRIHLASOVACÍ MODUL (LOGIN SCREEN)
           ============================================================
        */
        #login-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #ffd900; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 10000; 
            transition: opacity 0.8s ease;
        }

        .login-box { 
            background-color: #ffffff; 
            padding-top: 60px; 
            padding-bottom: 60px;
            padding-left: 50px;
            padding-right: 50px;
            border-radius: 40px; 
            border-width: 12px;
            border-style: solid;
            border-color: #000000; 
            text-align: center; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            width: 550px;
            max-width: 90%;
        }

        .login-box h1 { 
            font-size: 3.8em; 
            margin-bottom: 10px; 
            text-transform: uppercase; 
            letter-spacing: 4px;
            color: #000;
            line-height: 1;
        }

        .login-box p {
            font-size: 1.2em;
            color: #444;
            margin-bottom: 35px;
            font-weight: 500;
        }

        .login-box input { 
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 15px;
            padding-right: 15px;
            margin-top: 10px;
            margin-bottom: 20px; 
            border-width: 6px;
            border-style: solid;
            border-color: #000000; 
            border-radius: 18px; 
            width: 100%; 
            display: block; 
            font-size: 1.4em;
            text-align: center;
            outline: none;
            background-color: #f9f9f9;
        }

        .login-box input:focus {
            background-color: #fff;
            border-color: #008cff;
        }

        .btn-login { 
            background-color: #000000; 
            color: #ffffff; 
            padding-top: 22px; 
            padding-bottom: 22px;
            border: none; 
            border-radius: 18px; 
            cursor: pointer; 
            font-weight: 900; 
            width: 100%; 
            font-size: 1.6em; 
            margin-top: 15px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-login:hover {
            background-color: #333;
            transform: scale(1.04);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        #error-msg { 
            color: #ff0000; 
            display: none; 
            font-weight: 900; 
            margin-top: 25px; 
            font-size: 1.3em;
            background: #ffebeb;
            padding: 10px;
            border-radius: 10px;
        }

        /* ============================================================
           🎮 HERNÉ ROZHRANIE (MAIN INTERFACE)
           ============================================================
        */
        #game-screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: row;
        }

        /* 🗺️ MAPA A SVETOVÉ PROSTREDIE */
        .map-container { 
            flex: 1; 
            background-image: url('mesto.png'); 
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            border-right-width: 12px;
            border-right-style: solid;
            border-right-color: #000000; 
            position: relative; 
            overflow: hidden; 
            cursor: crosshair;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.2);
        }

        /* ☁️ DYNAMICKÝ SYSTÉM OBLAKOV */
        .cloud-element {
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 100px; 
            pointer-events: none; 
            filter: blur(6px);
            z-index: 10;
        }

        .cloud-element::before {
            content: ''; 
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.9); 
            border-radius: 50%;
            width: 90px; 
            height: 90px; 
            top: -45px; 
            left: 25px;
        }

        .cloud-element::after {
            content: ''; 
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.9); 
            border-radius: 50%;
            width: 110px; 
            height: 110px; 
            top: -55px; 
            left: 65px;
        }

        .cloud-slow { width: 180px; height: 55px; top: 8%; animation: moveSky 50s linear infinite; opacity: 0.8; }
        .cloud-med { width: 240px; height: 75px; top: 20%; animation: moveSky 80s linear infinite; animation-delay: -10s; opacity: 0.6; }
        .cloud-fast { width: 140px; height: 45px; top: 32%; animation: moveSky 35s linear infinite; animation-delay: -20s; opacity: 0.4; }
        .cloud-huge { width: 300px; height: 90px; top: 15%; animation: moveSky 120s linear infinite; animation-delay: -50s; opacity: 0.7; }
        .cloud-tiny { width: 100px; height: 30px; top: 40%; animation: moveSky 45s linear infinite; animation-delay: -5s; opacity: 0.5; }

        @keyframes moveSky {
            from { left: -400px; }
            to { left: 110%; }
        }

        /* 👤 MMO AVATARY (REAL-TIME POHYB) */
        .world-player {
            position: absolute;
            width: 70px;
            height: 70px;
            background-image: url('barbar.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition-property: left, top;
            transition-duration: 1.1s;
            transition-timing-function: cubic-bezier(0.2, 0.1, 0.2, 1.0);
            z-index: 500;
            filter: drop-shadow(0 12px 10px rgba(0,0,0,0.5));
        }

        .name-tag {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #000;
            color: #ffffff;
            padding-left: 12px;
            padding-right: 12px;
            padding-top: 6px;
            padding-bottom: 6px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
            border-width: 3px;
            border-style: solid;
            border-color: #ffd900;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* Farby pre rozlíšenie hráčov */
        .color-Lubo { border-color: #ff0000; }
        .color-Karol { border-color: #00ff00; }
        .color-Peter { border-color: #00aaff; }

        /* ============================================================
           🖥️ SIDEBAR (DETAILNÝ PANEL)
           ============================================================
        */
        .sidebar { 
            width: 440px; 
            background-color: #ffffff; 
            padding-left: 35px; 
            padding-right: 35px; 
            padding-top: 25px;
            padding-bottom: 25px;
            display: flex; 
            flex-direction: column; 
            box-shadow: -20px 0 60px rgba(0,0,0,0.5); 
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar h2 { 
            margin-top: 0; 
            margin-bottom: 25px;
            font-size: 2.6em;
            color: #000000;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #ffd900;
            padding-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
        }

        /* 📊 ŠTATISTICKÝ PANEL */
        .hero-stats-panel { 
            background-color: #f2f2f2; 
            padding: 25px; 
            border-radius: 30px; 
            border-width: 6px;
            border-style: solid;
            border-color: #222; 
            margin-bottom: 30px; 
        }

        .stat-line-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 1.8em; 
            font-weight: 900; 
            margin-top: 12px; 
            margin-bottom: 12px; 
        }

        .stat-title { color: #444; }
        .stat-num { color: #008cff; }

        /* 🕹️ OVLÁDACIE PRVKY */
        .sidebar-heading {
            font-size: 1.2em;
            font-weight: 900;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        button.city-action-btn { 
            background-color: #008cff; 
            color: #ffffff; 
            border-width: 5px;
            border-style: solid;
            border-color: #000; 
            padding: 20px; 
            border-radius: 18px; 
            cursor: pointer; 
            font-weight: 900; 
            width: 100%; 
            margin-bottom: 15px; 
            font-size: 1.1em;
            transition: all 0.2s ease;
            text-align: center;
        }

        button.city-action-btn:hover { 
            background-color: #005fbb; 
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-green-variant { background-color: #27ae60 !important; }
        .btn-green-variant:hover { background-color: #1e8449 !important; }

        /* ⚔️ ARENA PvP BOX */
        .pvp-arena-box { 
            background-color: #ffeaea; 
            padding-top: 25px;
            padding-bottom: 25px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 30px; 
            border-width: 6px;
            border-style: solid;
            border-color: #c0392b; 
            margin-top: 10px; 
            margin-bottom: 30px;
        }

        .pvp-arena-box h3 { 
            color: #c0392b; 
            margin-top: 0; 
            margin-bottom: 20px;
            font-size: 1.6em;
            text-align: center;
            text-transform: uppercase;
        }

        select.player-dropdown { 
            width: 100%; 
            padding: 16px; 
            border-width: 5px;
            border-style: solid;
            border-color: #000; 
            border-radius: 15px; 
            margin-bottom: 18px; 
            font-weight: 900; 
            font-size: 1.2em;
            background-color: #ffffff;
            cursor: pointer;
            outline: none;
        }

        .btn-attack-red { 
            background-color: #c0392b !important; 
            color: #ffffff !important;
        }

        /* 💬 KONZOLA A SVETOVÝ CHAT */
        .chat-container-module {
            margin-top: auto;
            display: flex;
            flex-direction: column;
        }

        #game-log-console { 
            background-color: #111111; 
            color: #00ff00; 
            padding: 20px; 
            height: 280px; 
            overflow-y: auto; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 15px; 
            border-width: 6px;
            border-style: solid;
            border-color: #000; 
            border-radius: 20px;
            line-height: 1.7;
            box-shadow: inset 0 0 25px #000;
            margin-bottom: 15px;
        }

        .chat-input-wrapper {
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        #chat-message-input {
            flex: 1;
            padding: 16px;
            border-width: 4px;
            border-style: solid;
            border-color: #000;
            border-radius: 15px;
            font-size: 1.1em;
            outline: none;
        }

        .btn-send-msg {
            padding-left: 25px;
            padding-right: 25px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 15px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-send-msg:hover {
            background-color: #444;
        }

    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Springfield RPG</h1>
            <p>Hraj so stovkami hráčov v reálnom čase!</p>
            
            <input type="text" id="login-user" placeholder="Meno hrdinu (Lubo, Karol, Peter)">
            <input type="password" id="login-pass" placeholder="Tvoje tajné heslo">
            
            <button class="btn-login" onclick="initiateLogin()">VSTÚPIŤ DO HRY</button>
            
            <p id="error-msg">❌ Chybné meno alebo heslo! Skús to znova.</p>
        </div>
    </div>

    <div id="game-screen">
        
        <div class="map-container" id="game-world-map" onclick="handleWorldMovement(event)">
            <div class="cloud-element cloud-slow"></div>
            <div class="cloud-element cloud-med"></div>
            <div class="cloud-element cloud-fast"></div>
            <div class="cloud-element cloud-huge"></div>
            <div class="cloud-element cloud-tiny"></div>
            
            <div id="players-on-map-layer"></div>
        </div>
        
        <div class="sidebar">
            <h2 id="hero-label-name">Hrdina: ---</h2>
            
            <div class="hero-stats-panel">
                <div class="stat-line-item">
                    <span class="stat-title">❤️ Zdravie:</span> 
                    <span id="stat-val-hp" class="stat-num">---</span>
                </div>
                <div class="stat-line-item">
                    <span class="stat-title">💪 Bojová Sila:</span> 
                    <span id="stat-val-str" class="stat-num">---</span>
                </div>
                <div class="stat-line-item">
                    <span class="stat-title">💰 Zlaté Goldy:</span> 
                    <span id="stat-val-gold" class="stat-num">---</span>
                </div>
            </div>

            <div class="chat-container-module">
                <div class="sidebar-heading">Mestské lokality</div>
                
                <button class="city-action-btn" onclick="executeQuest()">
                    🍺 Hospoda u Očka (Quest +50g)
                </button>
                
                <button class="city-action-btn" onclick="executeTraining()">
                    🏗️ Sektor 7-G (Sila +2 / -10g)
                </button>
                
                <button class="city-action-btn btn-green-variant" onclick="executeShop()">
                    🛒 Kwik-E-Mart (HP +50 / -150g)
                </button>
                
                <div class="pvp-arena-box">
                    <h3>⚔️ Súboj o Loot</h3>
                    <select id="victim-selection" class="player-dropdown">
                        <option value="">-- Vyber si obeť --</option>
                        <option value="Lubo">Lubo</option>
                        <option value="Karol">Karol</option>
                        <option value="Peter">Peter</option>
                    </select>
                    <button class="city-action-btn btn-attack-red" onclick="executePvP()">
                        ZAÚTOČIŤ NA HRÁČA
                    </button>
                </div>

                <div class="sidebar-heading">Svetový Chat a Denník</div>
                <div id="game-log-console">Systém: Spúšťam engine...</div>
                
                <div class="chat-input-wrapper">
                    <input 
                        type="text" 
                        id="chat-message-input" 
                        placeholder="Napíš správu všetkým..." 
                        onkeydown="if(event.key==='Enter') sendGlobalChatMsg()"
                    >
                    <button class="btn-send-msg" onclick="sendGlobalChatMsg()">POSLAŤ</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        /* Import core Firebase SDK funkcií */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            onSnapshot, 
            collection,
            addDoc,
            query,
            orderBy,
            limit
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        /* KONFIGURÁCIA DATABÁZY */
        const firebaseConfig = {
            apiKey: "AIzaSyBco-l3gRLUA9y4aPmYuYnRT_gkZJGo4E",
            authDomain: "springfield-heroes.firebaseapp.com",
            projectId: "springfield-heroes",
            storageBucket: "springfield-heroes.firebasestorage.app",
            messagingSenderId: "601449864337",
            appId: "1:601449864337:web:d98c8e66c5f27e756e7330"
        };

        /* Štartovanie MMO Engine */
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        /* Lokálny stav hrdinu v pamäti prehliadača */
        let localHero = { 
            name: "", 
            hp: 150, 
            str: 15, 
            gold: 100,
            x: 50,
            y: 50
        };

        /* Globálna poistka pre real-time synchronizáciu */
        let stopSnapshotAlert = false;

        // ------------------------------------------------------------
        // 🔑 MODUL: SYSTÉM PRIHLÁSENIA
        // ------------------------------------------------------------
        window.initiateLogin = async function() {
            const userIn = document.getElementById('login-user').value;
            const passIn = document.getElementById('login-pass').value;
            
            const databaseAccounts = { 
                "Lubo": "123Lubo", 
                "Karol": "123Karol", 
                "Peter": "123Peter" 
            };

            if (databaseAccounts[userIn] && databaseAccounts[userIn] === passIn) {
                localHero.name = userIn;
                
                // --- 1. MMO REAL-TIME LISTENER (Sledovanie všetkých hráčov) ---
                onSnapshot(collection(db, "players"), (snapshot) => {
                    const worldLayer = document.getElementById('players-on-map-layer');
                    worldLayer.innerHTML = ''; // Kompletný reset mapy pred prekreslením

                    snapshot.forEach((pDoc) => {
                        const data = pDoc.data();
                        
                        // Vykreslenie každého hráča na jeho súradnice
                        renderPlayerAvatar(data);
                        
                        // Synchronizácia štatistík nášho hrdinu
                        if (data.name === localHero.name) {
                            if (!stopSnapshotAlert && data.gold < localHero.gold) {
                                const diff = localHero.gold - data.gold;
                                writeToConsole(`🚨 ALERT: Niekto ťa napadol! Stratil si ${diff} goldov.`);
                            }
                            localHero = data;
                            refreshSidebarUI();
                        }
                    });
                });

                // --- 2. SVETOVÝ CHAT REAL-TIME LISTENER ---
                const chatRef = query(collection(db, "worldChat"), orderBy("timestamp", "desc"), limit(30));
                onSnapshot(chatRef, (chatSnap) => {
                    chatSnap.docChanges().reverse().forEach(change => {
                        if (change.type === "added") {
                            const cData = change.doc.data();
                            writeToConsole(`[CHAT] ${cData.user}: ${cData.text}`);
                        }
                    });
                });

                // Prepnúť obrazovky s efektom plynulosti
                document.getElementById('hero-label-name').innerText = "Hrdina: " + userIn;
                document.getElementById('login-screen').style.opacity = '0';
                
                setTimeout(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('game-screen').style.display = 'flex';
                }, 800);
                
                writeToConsole(`Systém: Prihlásenie úspešné. Vitaj, ${userIn}!`);
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        };

        // ------------------------------------------------------------
        // 🚶 MODUL: DYNAMICKÝ POHYB (MMO KLIKANIE)
        // ------------------------------------------------------------
        window.handleWorldMovement = async function(e) {
            const mapFrame = document.getElementById('game-world-map');
            const mapCoords = mapFrame.getBoundingClientRect();
            
            // Konverzia pixelov na percentuálnu pozíciu (X, Y)
            const posX = ((e.clientX - mapCoords.left) / mapCoords.width) * 100;
            const posY = ((e.clientY - mapCoords.top) / mapCoords.height) * 100;

            // Uloženie nových súradníc v lokálnej pamäti
            localHero.x = posX.toFixed(2);
            localHero.y = posY.toFixed(2);

            // Odoslanie pozície do Cloudu pre ostatných prihlásených hráčov
            stopSnapshotAlert = true;
            await updateDoc(doc(db, "players", localHero.name), {
                x: localHero.x,
                y: localHero.y
            });
            setTimeout(() => { stopSnapshotAlert = false; }, 600);
        };

        function renderPlayerAvatar(player) {
            const layer = document.getElementById('players-on-map-layer');
            const avatarDiv = document.createElement('div');
            
            avatarDiv.className = 'world-player';
            // Nastavenie polohy (mínus polovica šírky avatara pre presný stred)
            avatarDiv.style.left = `calc(${player.x}% - 35px)`;
            avatarDiv.style.top = `calc(${player.y}% - 35px)`;
            
            // Vytvorenie menovky hráča nad hlavou
            const label = document.createElement('div');
            label.className = `name-tag color-${player.name}`;
            label.innerText = player.name;
            
            avatarDiv.appendChild(label);
            layer.appendChild(avatarDiv);
        }

        // ------------------------------------------------------------
        // 💰 MODUL: HERNÉ LOKALITY A STATS
        // ------------------------------------------------------------
        async function pushStatsToCloud() {
            stopSnapshotAlert = true;
            const ref = doc(db, "players", localHero.name);
            await updateDoc(ref, localHero);
            setTimeout(() => { stopSnapshotAlert = false; }, 1000);
        }

        window.executeQuest = function() {
            localHero.gold += 50;
            writeToConsole("🍺 Zarobil si 50 goldov v Hospode.");
            refreshSidebarUI();
            pushStatsToCloud();
        };

        window.executeTraining = function() {
            if (localHero.gold >= 10) {
                localHero.gold -= 10;
                localHero.str += 2;
                writeToConsole("🏗️ Jadrový tréning dokončený. Sila +2.");
                refreshSidebarUI();
                pushStatsToCloud();
            } else {
                writeToConsole("❌ Málo goldov na tréning v elektrárni!");
            }
        };

        window.executeShop = function() {
            if (localHero.gold >= 150) {
                localHero.gold -= 150;
                localHero.hp += 50;
                writeToConsole("🛡️ Apu ti predal brnenie. HP +50.");
                refreshSidebarUI();
                pushStatsToCloud();
            } else {
                writeToConsole("❌ Apu: 'Potrebuješ presne 150 goldov!'");
            }
        };

        // ------------------------------------------------------------
        // ⚔️ MODUL: PvP SÚBOJE V ARÉNE (Loot 1-10%)
        // ------------------------------------------------------------
        window.executePvP = async function() {
            const targetName = document.getElementById('victim-selection').value;
            
            if (!targetName || targetName === localHero.name) {
                writeToConsole("❌ Vyber si reálneho súpera!");
                return;
            }

            writeToConsole(`⚔️ Útočíš na hráča ${targetName}...`);
            
            const targetDocRef = doc(db, "players", targetName);
            const targetSnap = await getDoc(targetDocRef);

            if (targetSnap.exists()) {
                const targetD = targetSnap.data();
                
                // Generovanie bojovej sily (Sila + RNG)
                const attackPower = localHero.str + Math.floor(Math.random() * 30);
                const defensePower = targetD.str + Math.floor(Math.random() * 30);

                if (attackPower > defensePower) {
                    // Výpočet percentuálneho lúpenia
                    const lootPercent = (Math.floor(Math.random() * 10) + 1) / 100;
                    let stolenAmount = Math.floor(targetD.gold * lootPercent);
                    
                    if (stolenAmount < 1 && targetD.gold > 0) stolenAmount = 1;

                    // Update cloudu pre obeť (Zníženie goldov)
                    await updateDoc(targetDocRef, { gold: targetD.gold - stolenAmount });
                    
                    // Update cloudu pre útočníka (Zisk goldov)
                    localHero.gold += stolenAmount;
                    writeToConsole(`✅ VÍŤAZSTVO! Ukradol si ${stolenAmount} goldov.`);
                    refreshSidebarUI();
                    pushStatsToCloud();
                } else {
                    writeToConsole(`💀 PREHRA! Hráč ${targetName} ťa v súboji zmasakroval.`);
                }
            } else {
                writeToConsole("❌ Súper zatiaľ nie je v databáze.");
            }
        };

        // ------------------------------------------------------------
        // 💬 MODUL: GLOBÁLNY SVETOVÝ CHAT
        // ------------------------------------------------------------
        window.sendGlobalChatMsg = async function() {
            const chatField = document.getElementById('chat-message-input');
            const message = chatField.value.trim();
            
            if (message === "") return;

            await addDoc(collection(db, "worldChat"), {
                user: localHero.name,
                text: message,
                timestamp: Date.now()
            });

            chatField.value = "";
        };

        // ------------------------------------------------------------
        // ⚙️ UI POMOCNÉ FUNKCIE (INTERFACE)
        // ------------------------------------------------------------
        function refreshSidebarUI() {
            document.getElementById('stat-val-hp').innerText = localHero.hp;
            document.getElementById('stat-val-str').innerText = localHero.str;
            document.getElementById('stat-val-gold').innerText = localHero.gold;
        }

        function writeToConsole(txt) {
            const consoleBox = document.getElementById('game-log-console');
            const date = new Date();
            const timeStr = date.getHours() + ":" + date.getMinutes().toString().padStart(2, '0');
            
            // Pridanie správy do denníka
            consoleBox.innerHTML += `[${timeStr}] > ${txt}<br>`;
            
            // Automatické skrolovanie na spodok denníka
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Pomocná funkcia pre inicializáciu úplne nového účtu
        async function firstTimeCloudSetup(n) {
            const initData = { name: n, hp: 150, str: 15, gold: 100, x: 50, y: 50 };
            await setDoc(doc(db, "players", n), initData);
        }

    </script>
</body>
</html>
