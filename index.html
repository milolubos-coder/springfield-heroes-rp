<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title>Springfield Heroes RPG - The Orc & Elf MMO</title>
    
    <style>
        /* ============================================================
           🎨 1. GLOBÁLNY DIZAJN (CSS ARCHITEKTÚRA)
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffd900; 
            display: flex; 
            flex-direction: row;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            color: #222222;
        }

        /* ============================================================
           🔒 2. LOGIN MODUL (AUTENTIFIKÁCIA)
           ============================================================ */
        #login-screen { 
            position: fixed; 
            top: 0px; 
            left: 0px; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #ffd900 0%, #ffcc00 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 100000; 
        }

        .login-card { 
            background-color: #ffffff; 
            padding-top: 70px;
            padding-bottom: 70px;
            padding-left: 60px;
            padding-right: 60px;
            border-radius: 50px; 
            border-width: 15px;
            border-style: solid;
            border-color: #000000; 
            text-align: center; 
            box-shadow: 0px 50px 120px rgba(0,0,0,0.6);
            width: 650px;
            max-width: 95%;
        }

        .login-card h1 { 
            font-size: 4em; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 6px;
            color: #000000;
            font-weight: 900;
        }

        .login-card p {
            font-size: 1.4em;
            color: #444444;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .login-card input { 
            padding-top: 22px;
            padding-bottom: 22px;
            padding-left: 25px;
            padding-right: 25px;
            margin-top: 15px;
            margin-bottom: 25px; 
            border-width: 6px;
            border-style: solid;
            border-color: #333333; 
            border-radius: 20px; 
            width: 100%; 
            display: block; 
            font-size: 1.5em;
            text-align: center;
            background-color: #f9f9f9;
        }

        .btn-enter-world { 
            background-color: #000000; 
            color: #ffffff; 
            padding-top: 25px; 
            padding-bottom: 25px;
            border-style: none;
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 900; 
            width: 100%; 
            font-size: 1.8em; 
            margin-top: 20px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-enter-world:hover {
            transform: scale(1.05);
            background-color: #222222;
            box-shadow: 0px 20px 40px rgba(0,0,0,0.3);
        }

        /* ============================================================
           🗺️ 3. DYNAMICKÝ SVET - MAPA A OBJEKTY
           ============================================================ */
        #game-screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: row;
        }

        .map-viewport { 
            flex: 1; 
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E2FF 100%);
            position: relative; 
            overflow: hidden; 
            border-right-width: 18px;
            border-right-style: solid;
            border-right-color: #000000;
            cursor: crosshair;
        }

        /* ZEM A TRÁVA */
        .landscape-grass {
            position: absolute;
            bottom: 0px;
            left: 0px;
            width: 100%;
            height: 60%;
            background-color: #7ed321;
            z-index: 1;
            border-top-width: 10px;
            border-top-style: solid;
            border-top-color: #5ca316;
        }

        /* CESTA */
        .road-path {
            position: absolute;
            bottom: 18%;
            left: -10%;
            width: 120%;
            height: 160px;
            background-color: #333333;
            z-index: 2;
            transform: rotate(-1.2deg);
            border-top-width: 8px;
            border-top-style: solid;
            border-top-color: #111111;
            border-bottom-width: 8px;
            border-bottom-style: solid;
            border-bottom-color: #111111;
        }

        .road-line {
            position: absolute;
            top: 50%;
            left: 0px;
            width: 100%;
            height: 10px;
            background-image: repeating-linear-gradient(90deg, #ffffff, #ffffff 60px, transparent 60px, transparent 120px);
            margin-top: -5px;
        }

        /* ☁️ OBLAKY */
        .sky-cloud {
            position: absolute; 
            background-color: #ffffff;
            border-radius: 100px; 
            filter: blur(8px); 
            z-index: 5;
            animation: driftClouds linear infinite;
        }
        .sky-cloud::before {
            content: ''; position: absolute; background-color: #fff; border-radius: 50%;
            width: 100px; height: 100px; top: -50px; left: 20px;
        }
        .sky-cloud::after {
            content: ''; position: absolute; background-color: #fff; border-radius: 50%;
            width: 130px; height: 130px; top: -60px; left: 70px;
        }

        @keyframes driftClouds { from { left: -500px; } to { left: 110%; } }

        /* ============================================================
           🏢 4. BUDOVY (VLASTNÁ ARCHITEKTÚRA)
           ============================================================ */
        
        /* 🏭 JADROVÁ ELEKTRÁREŇ */
        .power-plant-area {
            position: absolute; top: 8%; right: 5%; width: 400px; height: 300px;
            z-index: 10; cursor: pointer;
        }
        .pp-building {
            position: absolute; bottom: 0; width: 100%; height: 200px;
            background-color: #a5a5a5; border: 8px solid #000;
        }
        .pp-tower {
            position: absolute; top: -150px; width: 110px; height: 170px;
            background-color: #ccc; border: 8px solid #000;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }
        .t1 { left: 40px; } .t2 { right: 40px; }
        .pp-smoke {
            position: absolute; top: -190px; left: 20px; width: 70px; height: 70px;
            background: rgba(220,220,220,0.8); border-radius: 50%; filter: blur(20px);
            animation: riseSmoke 4s infinite linear;
        }
        @keyframes riseSmoke {
            0% { transform: translateY(0) scale(1); opacity: 0.9; }
            100% { transform: translateY(-300px) scale(6); opacity: 0; }
        }

        /* 🍺 HOSPODA */
        .pub-area {
            position: absolute; bottom: 25%; left: 4%; width: 340px; height: 260px;
            z-index: 10; cursor: pointer;
        }
        .pub-structure {
            position: absolute; bottom: 0; width: 100%; height: 210px;
            background-color: #8b4513; border: 10px solid #000;
        }
        .pub-sign {
            position: absolute; top: 30px; width: 100%; text-align: center;
            color: #00ffdd; font-weight: 900; font-size: 1.8em;
            text-shadow: 0 0 20px #00ffdd; animation: neonPulse 2s infinite;
        }
        @keyframes neonPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* 🛒 KWIK-E-MART */
        .shop-area {
            position: absolute; top: 40%; left: 35%; width: 300px; height: 220px;
            z-index: 10; cursor: pointer;
        }
        .shop-structure {
            position: absolute; bottom: 0; width: 100%; height: 180px;
            background-color: #ff4d4d; border: 8px solid #000;
        }
        .shop-banner {
            background-color: #ffd900; color: #000; padding: 15px;
            border-bottom: 8px solid #000; text-align: center; font-weight: 900; font-size: 1.4em;
        }

        /* ============================================================
           👤 5. POSTAVY (ORK, ELF, BARBAR)
           ============================================================ */
        .character-node {
            position: absolute;
            z-index: 1000;
            transition: all 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Generický sprite pre chôdzu */
        .sprite-walk {
            width: 100px;
            height: 140px;
            background-size: cover;
            filter: drop-shadow(0px 20px 15px rgba(0,0,0,0.5));
            animation: move-legs 0.8s steps(4) infinite;
        }

        @keyframes move-legs {
            from { background-position: 0px; }
            to { background-position: -400px; }
        }

            padding-top: 25px;
            padding-bottom: 25px;
            display: flex; 
            flex-direction: column; 
            box-shadow: -25px 0 60px rgba(0,0,0,0.4); 
            overflow-y: auto;
            z-index: 1000;
        }

        .sidebar h2 { font-size: 2.8em; text-align: center; border-bottom: 8px solid #ffd900; padding-bottom: 12px; margin-bottom: 25px; text-transform: uppercase; }

            background-color: #f2f2f2; padding: 25px; border-radius: 30px; 
            border: 6px solid #222; margin-bottom: 25px;

        .stat-line { display: flex; justify-content: space-between; font-size: 1.8em; font-weight: 900; margin: 10px 0; }

            line-height: 1.7; box-shadow: inset 0 0 20px #000; margin-bottom: 15px;

        .btn-send { background: #000; color: #fff; border: none; padding: 0 25px; border-radius: 15px; font-weight: bold; cursor: pointer; }

<body onclick="processMapMovement(event)">

    <div id="login-screen">
        <div class="login-card">
            <h1>Springfield Live</h1>
            <p>Prihlás sa, vyber postavu a ovládni mesto!</p>
            
            <input type="text" id="auth-user" placeholder="Meno (Lubo, Karol, Peter)">
            <input type="password" id="auth-pass" placeholder="Tvoje heslo">
            
            <button class="btn-enter-world" onclick="startMMO()">VSTÚPIŤ DO HRY</button>
            
            <p id="auth-error" style="color:red; display:none; margin-top:25px; font-weight:900;">❌ Neplatné prihlasovacie údaje!</p>
        </div>
    </div>

    <div id="game-screen">
        
        <div class="map-viewport" id="viewport">
            <div class="landscape-grass"></div>
            <div class="road-path"><div class="road-line"></div></div>

            <div class="sky-cloud" style="width:200px; height:65px; top:5%; animation-duration:45s;"></div>
            <div class="sky-cloud" style="width:300px; height:90px; top:20%; animation-duration:75s; animation-delay:-10s;"></div>

            <div class="pub-area" onclick="triggerBuilding('quest')">
                <div class="pub-structure"><div class="neon-sign">U SMÄDNÉHO MEDVEĎA</div></div>
            </div>

            <div class="power-plant-area" onclick="triggerBuilding('train')">
                <div class="pp-tower t1"><div class="pp-smoke"></div><div class="pp-smoke" style="animation-delay:2s;"></div></div>
                <div class="pp-tower t2"><div class="pp-smoke" style="animation-delay:1s;"></div></div>
                <div class="pp-building"><div style="color:white; text-align:center; padding:20px; font-weight:900; font-size:1.6em;">SEKTOR 7-G</div></div>
            </div>

            <div class="shop-area" onclick="triggerBuilding('shop')">
                <div class="shop-structure"><div class="shop-banner">KWIK-E-MART</div></div>
            </div>

            <div class="bus-dynamic"></div>

            <div id="mmo-characters-layer"></div>
        </div>
        
        <div class="sidebar">
            <h2 id="hero-display-name">Hrdina: ---</h2>
            
            <div class="stats-box">
                <div class="stat-line"><span>❤️ HP (Zdravie):</span> <span id="val-hp" class="stat-val">---</span></div>
                <div class="stat-line"><span>💪 SILA (Bojová):</span> <span id="val-str" class="stat-val">---</span></div>
                <div class="stat-line"><span>💰 GOLDY (Zlato):</span> <span id="val-gold" class="stat-val">---</span></div>
            </div>

            <div id="game-log">Pripájanie k herným serverom...</div>

            <div class="chat-row">
                <input type="text" id="chat-input-field" placeholder="Napíš správu..." onkeydown="if(event.key==='Enter') dispatchChat()">
                <button class="btn-send" onclick="dispatchChat()">POSLAŤ</button>
            </div>
            
            <div class="arena-box">
                <h3>⚔️ Springfield Aréna (Loot 10%)</h3>
                <select id="victim-select" class="target-list">
                    <option value="">-- Vyber obeť --</option>
                    <option value="Lubo">Lubo</option>
                    <option value="Karol">Karol</option>
                    <option value="Peter">Peter</option>
                </select>
                <button class="btn-duel" onclick="executePvP()">ZAÚTOČIŤ NA HRÁČA!</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tvoja Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBco-l3gRLUA9y4aPmYuYnRT_gkZJGo4E",
            authDomain: "springfield-heroes.firebaseapp.com",
            projectId: "springfield-heroes",
            storageBucket: "springfield-heroes.firebasestorage.app",
            messagingSenderId: "601449864337",
            appId: "1:601449864337:web:d98c8e66c5f27e756e7330"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let hero = { name: "", hp: 150, str: 15, gold: 100, x: 50, y: 50 };
        let localLock = false;

        // --- 🔑 LOGIN ---
        window.startMMO = async function() {
            const u = document.getElementById('auth-user').value;
            const p = document.getElementById('auth-pass').value;
            const valid = { "Lubo":"123Lubo", "Karol":"123Karol", "Peter":"123Peter" };

            if (valid[u] && valid[u] === p) {
                hero.name = u;
                
                // Real-time MMO Listener
                onSnapshot(collection(db, "players"), (snap) => {
                    const l = document.getElementById('mmo-characters-layer');
                    l.innerHTML = '';
                    snap.forEach(d => {
                        const data = d.data();
                        renderSprite(data);
                        if (data.name === hero.name) {
                            if (!localLock && data.gold < hero.gold) writeLog(`🚨 ALERT: Niekto ťa napadol! Stratil si ${hero.gold - data.gold} goldov.`);
                            hero = data;
                            refreshUI();
                        }
                    });
                });

                // Chat Listener
                const qMsg = query(collection(db, "chat"), orderBy("time", "desc"), limit(25));
                onSnapshot(qMsg, s => {
                    s.docChanges().reverse().forEach(c => {
                        if (c.type === "added") writeLog(`[CHAT] ${c.doc.data().user}: ${c.doc.data().msg}`);
                    });
                });

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('hero-display-name').innerText = "Hrdina: " + u;
                writeLog(`Vitaj, ${u}! Svet je tvoj.`);
            } else {
                document.getElementById('auth-error').style.display = 'block';
            }
        };

        // --- 🚶 POHYB ---
        window.processMapMovement = async function(e) {
            if (e.target.closest('.sidebar')) return;
            const view = document.getElementById('viewport');
            const r = view.getBoundingClientRect();
            
            hero.x = ((e.clientX - r.left) / r.width) * 100;
            hero.y = ((e.clientY - r.top) / r.height) * 100;
            
            localLock = true;
            await updateDoc(doc(db, "players", hero.name), { x: hero.x, y: hero.y });
            setTimeout(() => { localLock = false; }, 800);
        };

        function renderSprite(p) {
            const layer = document.getElementById('mmo-characters-layer');
            const div = document.createElement('div');
            
            div.className = 'character-node';
            // Nastavenie polohy (X, Y)
            div.style.left = `calc(${p.x}% - 50px)`;
            div.style.top = `calc(${p.y}% - 120px)`; 
            
            // Logika postáv
            let raceClass = 'hero-human'; 
            let visualClass = 'human-visual';
            
            if (p.name === 'Lubo') { 
                raceClass = 'hero-orc'; 
                visualClass = 'orc-visual'; 
            } else if (p.name === 'Karol') { 
                raceClass = 'hero-elf'; 
                visualClass = 'elf-visual'; 
            }
            
            div.classList.add(raceClass);
            
            div.innerHTML = `
                <div class="hero-tag">${p.name}</div>
                <div class="sprite-walk ${visualClass}"></div>
            `;
            layer.appendChild(div);
        }

        // --- 🏠 AKCIE ---
        window.triggerBuilding = async function(type) {
            if (type === 'quest') { hero.gold += 50; writeLog("Zarobil si 50 goldov u Očka."); }
            if (type === 'train') { 
                if(hero.gold >= 10) { hero.gold -= 10; hero.str += 2; writeLog("Sila vzrástla o 2!"); }
                else writeLog("❌ Nemáš dosť peňazí na tréning.");
            }
            if (type === 'shop') {
                if(hero.gold >= 150) { hero.gold -= 150; hero.hp += 50; writeLog("Kúpené brnenie. HP +50."); }
                else writeLog("❌ Apu: 'Potrebuješ 150 goldov, pane!'");
            }
            localLock = true;
            await updateDoc(doc(db, "players", hero.name), hero);
            setTimeout(() => { localLock = false; }, 1000);
        };

        // --- ⚔️ PvP ---
        window.executePvP = async function() {
            const target = document.getElementById('victim-select').value;
            if(!target || target === hero.name) return writeLog("Vyber si obeť!");
            
            writeLog(`⚔️ Bojuješ proti ${target}...`);
            const tRef = doc(db, "players", target);
            const tSnap = await getDoc(tRef);
            
            if(tSnap.exists()) {
                let tData = tSnap.data();
                if((hero.str + Math.random()*25) > (tData.str + Math.random()*25)) {
                    let loot = Math.floor(tData.gold * 0.10); // 10% loot
                    if(loot < 1 && tData.gold > 0) loot = 1;

                    await updateDoc(tRef, { gold: tData.gold - loot });
                    hero.gold += loot;
                    writeLog(`✅ VÍŤAZSTVO! Ukradol si ${loot} goldov hráčovi ${target}.`);
                    localLock = true;
                    await updateDoc(doc(db, "players", hero.name), { gold: hero.gold });
                    setTimeout(() => { localLock = false; }, 1000);
                } else {
                    writeLog(`💀 PORÁŽKA! ${target} ťa zmlátil.`);
                }
            }
        };

        // --- CHAT ---
        window.dispatchChat = async () => {
            const field = document.getElementById('chat-input-field');
            if (!field.value) return;
            await addDoc(collection(db, "chat"), { user: hero.name, msg: field.value, time: Date.now() });
            field.value = "";
        };

        function refreshUI() {
            document.getElementById('val-hp').innerText = hero.hp;
            document.getElementById('val-str').innerText = hero.str;
            document.getElementById('val-gold').innerText = hero.gold;
        }

        function writeLog(m) {
            const b = document.getElementById('game-log');
            const d = new Date();
            const time = d.getHours() + ":" + d.getMinutes().toString().padStart(2, '0');
            b.innerHTML += `[${time}] > ${m}<br>`;
            b.scrollTop = b.scrollHeight;
        }
    </script>
</body>
</html>
