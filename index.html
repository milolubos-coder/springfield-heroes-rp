<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Springfield Heroes RPG - Login</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: #ffd900; 
            margin: 0; padding: 0;
            display: flex; height: 100vh;
        }

        /* 🔒 LOGIN OBRAZOVKA */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffd900; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 15px;
            border: 5px solid #000; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input { padding: 10px; margin: 10px; border: 2px solid #333; border-radius: 5px; width: 200px; display: block; }
        .login-btn { background: #000; color: #fff; padding: 10px 20px; cursor: pointer; font-weight: bold; }

        /* 🎮 HERNÁ OBRAZOVKA (skrytá na začiatku) */
        #game-screen { display: none; width: 100%; height: 100vh; }
        
        /* Ostatné štýly zostávajú */
        .map-container { flex: 1; background: url('mesto.png') no-repeat center center; background-size: cover; position: relative; border-right: 5px solid #000; }
        .sidebar { width: 320px; background: white; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: -10px 0 20px rgba(0,0,0,0.3); }
        .stats { background: #eee; padding: 15px; border-radius: 10px; border: 2px solid #333; margin-bottom: 20px; }
        .stat-item { margin: 5px 0; font-size: 1.1em; font-weight: bold; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        button { background: #008cff; color: white; border: 3px solid #000; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #log { background: #333; color: #0f0; padding: 10px; height: 150px; overflow-y: scroll; font-family: monospace; border-radius: 5px; border: 2px solid #000; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Kto si, hrdina?</h1>
            <input type="text" id="username" placeholder="Meno (Lubo, Karol, Peter)">
            <input type="password" id="password" placeholder="Heslo">
            <button class="login-btn" onclick="checkLogin()">Vstúpiť do mesta</button>
            <p id="error-msg" style="color: red; display: none;">Nesprávne meno alebo heslo!</p>
        </div>
    </div>

    <div id="game-screen" style="display: flex; width: 100%;">
        <div class="map-container"></div>
        <div class="sidebar">
            <div>
                <h2 id="player-display">Hrdina: ---</h2>
                <div class="stats">
                    <div class="stat-item">❤️ HP: <span id="hp">150</span></div>
                    <div class="stat-item">💪 Sila: <span id="str">15</span></div>
                    <div class="stat-item">💰 Goldy: <span id="gold">100</span></div>
                </div>
                <div class="actions">
                    <button onclick="playQuest()">Hospoda (Quest)</button>
                    <button onclick="train()">Elektráreň (Tréning)</button>
                    <button onclick="buyArmor()">Obchod (Brnenie)</button>
                </div>
            </div>
            <div id="log">Vitaj v hre!</div>
        </div>
    </div>

    <script>
        // 🔑 Prihlasovacie údaje
        const users = {
            "Lubo": "123Lubo",
            "Karol": "123Karol",
            "Peter": "123Peter"
        };

        let hero = { hp: 150, str: 15, gold: 100, name: "" };

        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (users[user] && users[user] === pass) {
                hero.name = user;
                document.getElementById('player-display').innerText = "Hrdina: " + user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                log("Hrdina " + user + " vstúpil do Springfieldu.");
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        // --- HERNÉ FUNKCIE ---
        function updateUI() {
            document.getElementById('hp').innerText = hero.hp;
            document.getElementById('str').innerText = hero.str;
            document.getElementById('gold').innerText = hero.gold;
        }

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += "> " + msg + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function playQuest() { hero.gold += 50; log("Quest hotový! +50g"); updateUI(); }
        function train() { if(hero.gold>=10){ hero.gold-=10; hero.str+=2; log("Tréning! Sila +2"); } updateUI(); }
        function buyArmor() { if(hero.gold>=150){ hero.gold-=150; hero.hp+=50; log("Nové brnenie! HP +50"); } updateUI(); }
    </script>
</body>
</html>
