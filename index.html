<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title>Springfield Heroes MMO - The Orc Legacy</title>
    
    <style>
        /* ============================================================
           🎨 1. GLOBÁLNE FORMÁTOVANIE (CSS)
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffd900; 
            display: flex; 
            flex-direction: row;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            color: #222222;
        }

        /* ============================================================
           🔒 2. PRIHLASOVACÍ MODUL (LOGIN SCREEN)
           ============================================================ */
        #login-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #ffd900 0%, #ffcc00 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 100000; 
        }

        .login-card { 
            background-color: #ffffff; 
            padding-top: 60px;
            padding-bottom: 60px;
            padding-left: 50px;
            padding-right: 50px;
            border-radius: 50px; 
            border-width: 15px;
            border-style: solid;
            border-color: #000000; 
            text-align: center; 
            box-shadow: 0px 50px 120px rgba(0,0,0,0.6);
            width: 650px;
            max-width: 95%;
        }

        .login-card h1 { 
            font-size: 4em; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            letter-spacing: 6px;
            color: #000000;
            font-weight: 900;
        }

        .login-card p {
            font-size: 1.4em;
            color: #444444;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .login-card input { 
            padding-top: 22px;
            padding-bottom: 22px;
            padding-left: 25px;
            padding-right: 25px;
            margin-top: 10px;
            margin-bottom: 25px; 
            border-width: 6px;
            border-style: solid;
            border-color: #333333; 
            border-radius: 20px; 
            width: 100%; 
            display: block; 
            font-size: 1.5em;
            text-align: center;
            background-color: #f9f9f9;
        }

        .btn-play-game { 
            background-color: #000000; 
            color: #ffffff; 
            padding-top: 25px; 
            padding-bottom: 25px;
            border-style: none;
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 900; 
            width: 100%; 
            font-size: 1.8em; 
            margin-top: 20px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-play-game:hover {
            transform: scale(1.05);
            background-color: #222222;
        }

        /* ============================================================
           🗺️ 3. DYNAMICKÝ SVET - MAPA A ARCHITEKTÚRA
           ============================================================ */
        #game-screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: row;
        }

        .map-viewport { 
            flex: 1; 
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E2FF 100%);
            position: relative; 
            overflow: hidden; 
            border-right-width: 18px;
            border-right-style: solid;
            border-right-color: #000000;
            cursor: crosshair;
        }

        .landscape-grass {
            position: absolute;
            bottom: 0px;
            left: 0px;
            width: 100%;
            height: 60%;
            background-color: #7ed321;
            z-index: 1;
            border-top-width: 10px;
            border-top-style: solid;
            border-top-color: #5ca316;
        }

        /* CESTA */
        .road-area {
            position: absolute;
            bottom: 18%;
            left: -10%;
            width: 120%;
            height: 160px;
            background-color: #333333;
            z-index: 2;
            transform: rotate(-1.5deg);
            border-top-width: 8px;
            border-top-style: solid;
            border-top-color: #111111;
            border-bottom-width: 8px;
            border-bottom-style: solid;
            border-bottom-color: #111111;
        }

        .road-line {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 10px;
            background-image: repeating-linear-gradient(90deg, #ffffff, #ffffff 60px, transparent 60px, transparent 120px);
            margin-top: -5px;
        }

        /* OBLAKY */
        .sky-cloud {
            position: absolute; background: #fff; border-radius: 100px; 
            filter: blur(8px); z-index: 5; animation: drift linear infinite;
        }
        .sky-cloud::before { content: ''; position: absolute; background: #fff; border-radius: 50%; width: 100px; height: 100px; top: -50px; left: 20px; }
        .sky-cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; width: 130px; height: 130px; top: -60px; left: 70px; }
        @keyframes drift { from { left: -500px; } to { left: 110%; } }

        /* ============================================================
           👤 4. POSTAVY, POHYB A CHATOVACIE BUBLINY
           ============================================================ */
        
        .player-container {
            position: absolute;
            z-index: 1000;
            /* PLYNULÝ POHYB NAMIESTO TELEPORTU */
            transition: left 1.5s cubic-bezier(0.25, 0.1, 0.25, 1.0), 
                        top 1.5s cubic-bezier(0.25, 0.1, 0.25, 1.0);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CHATOVACIA BUBLINA */
        .speech-bubble {
            position: absolute;
            bottom: 220px; /* Nad menovkou a hlavou */
            background-color: #ffffff;
            border: 5px solid #000000;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 16px;
            color: #000;
            white-space: nowrap;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transform: scale(0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            max-width: 300px;
        }

        .bubble-visible {
            opacity: 1;
            transform: scale(1);
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px;
            border-style: solid;
            border-color: #000 transparent transparent transparent;
        }

        .name-tag {
            background-color: rgba(0,0,0,0.9);
            color: #ffffff;
            padding-top: 6px;
            padding-bottom: 6px;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            border: 3px solid #ffd900;
            margin-bottom: 10px;
            white-space: nowrap;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        /* 👹 LUBO - VIZUÁL ORKA (PODĽA OBRÁZKA) */
        .visual-orc-master {
            width: 120px;
            height: 160px;
            position: relative;
            animation: breathe 2s infinite ease-in-out;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.4));
        }

        /* Hlava orka */
        .orc-head {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 70px;
            background-color: #6B8E23; /* Orkská zelená z obrázka */
            border: 5px solid #000;
            border-radius: 20px;
            z-index: 5;
        }

        /* Účes - Ponytail */
        .orc-hair {
            position: absolute;
            top: -25px;
            left: 50%;
            width: 15px;
            height: 40px;
            background-color: #4B3621;
            border: 3px solid #000;
            border-radius: 10px;
            z-index: 4;
        }

        /* Kly */
        .orc-tusks {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 10px;
            display: flex;
            justify-content: space-between;
        }
        .tusk {
            width: 8px;
            height: 12px;
            background-color: #fff;
            border: 2px solid #000;
            border-radius: 0 0 5px 5px;
        }

        /* Trup a Brnenie */
        .orc-body {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 80px;
            background-color: #8B4513; /* Hnedá koža z obrázka */
            border: 6px solid #000;
            border-radius: 15px;
            z-index: 3;
        }

        /* Ramená (Pauldrons) */
        .orc-shoulder {
            position: absolute;
            top: 55px;
            width: 45px;
            height: 40px;
            background-color: #5D4037;
            border: 5px solid #000;
            border-radius: 10px;
            z-index: 4;
        }
        .s-left { left: -10px; }
        .s-right { right: -10px; }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* 🧝 KAROL - VIZUÁL ELFA */
        .visual-elf-master {
            width: 100px;
            height: 160px;
            position: relative;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.3));
        }

        .elf-head {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 50px; height: 60px; background-color: #FFE4C4; border: 4px solid #000; border-radius: 50%; z-index: 5;
        }
        .elf-ears {
            position: absolute; top: 15px; left: -10px; width: 70px; height: 15px;
            background-color: #FFE4C4; border: 4px solid #000; z-index: 4; clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
        }
        .elf-body {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 80px; background-color: #2E7D32; border: 5px solid #000; border-radius: 10px; z-index: 3;
        }

        /* ============================================================
           🖥️ 5. SIDEBAR - PANEL OVLÁDANIA A LOG
           ============================================================ */
        .sidebar-right { 
            width: 480px; 
            background-color: #ffffff; 
            padding-left: 35px; 
            padding-right: 35px; 
            padding-top: 25px;
            padding-bottom: 25px;
            display: flex; 
            flex-direction: column; 
            box-shadow: -25px 0 60px rgba(0,0,0,0.5); 
            overflow-y: auto;
            z-index: 10000;
        }

        .sidebar-right h2 { 
            font-size: 2.8em; 
            text-align: center; 
            border-bottom-width: 8px;
            border-bottom-style: solid;
            border-bottom-color: #ffd900; 
            padding-bottom: 12px; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
        }

        .stats-display { 
            background-color: #f2f2f2; 
            padding: 25px; 
            border-radius: 30px; 
            border-width: 6px;
            border-style: solid;
            border-color: #222222; 
            margin-bottom: 30px; 
        }

        .stat-item { 
            display: flex; 
            justify-content: space-between; 
            font-size: 1.8em; 
            font-weight: 900; 
            margin-top: 12px; 
            margin-bottom: 12px; 
        }

        .stat-val { color: #008cff; }

        /* LOGOVACIA KONZOLA */
        #game-log { 
            background-color: #111111; 
            color: #00ff00; 
            padding: 20px; 
            height: 350px; 
            overflow-y: auto; 
            font-family: 'Courier New', monospace; 
            font-size: 16px; 
            border-width: 6px;
            border-style: solid;
            border-color: #000000; 
            border-radius: 25px;
            line-height: 1.8; 
            box-shadow: inset 0 0 25px #000;
            margin-bottom: 20px;
        }

        .chat-input-row { 
            display: flex; 
            gap: 15px; 
        }

        .chat-input-row input { 
            flex: 1; 
            padding: 18px; 
            border-width: 5px;
            border-style: solid;
            border-color: #000000; 
            border-radius: 18px; 
            font-size: 1.2em; 
            outline: none; 
        }

        .btn-send-chat { 
            background-color: #000000; 
            color: #ffffff; 
            padding-left: 25px;
            padding-right: 25px;
            border-radius: 18px; 
            font-weight: 900; 
            cursor: pointer; 
            border: none;
        }

        /* ARENA */
        .pvp-module { 
            background-color: #ffeaea; 
            padding: 25px; 
            border-radius: 35px; 
            border-width: 6px;
            border-style: solid;
            border-color: #c0392b; 
            margin-top: 20px; 
        }

        .btn-attack-now { 
            width: 100%; 
            padding: 20px; 
            background-color: #c0392b; 
            color: #ffffff; 
            border-width: 5px;
            border-style: solid;
            border-color: #000; 
            border-radius: 20px; 
            font-weight: 900; 
            font-size: 1.4em; 
            cursor: pointer; 
            text-transform: uppercase;
        }

    </style>
</head>
<body onclick="handleMapMovement(event)">

    <div id="login-screen">
        <div class="login-card">
            <h1>Springfield RPG</h1>
            <p>Prihlás sa a tvoja postava ožije v reálnom čase!</p>
            
            <input type="text" id="user-field" placeholder="Meno hrdinu (Lubo, Karol, Peter)">
            <input type="password" id="pass-field" placeholder="Tvoje tajné heslo">
            
            <button class="btn-play-game" onclick="startMMOEngine()">VSTÚPIŤ DO HRY</button>
            
            <p id="error-auth" style="color:red; display:none; margin-top:25px; font-weight:900;">❌ Chybné údaje!</p>
        </div>
    </div>

    <div id="game-screen">
        
        <div class="map-viewport" id="game-viewport">
            <div class="landscape-grass"></div>
            <div class="road-area"><div class="road-line"></div></div>

            <div class="sky-cloud" style="width:200px; height:60px; top:5%; animation-duration:45s;"></div>
            <div class="sky-cloud" style="width:280px; height:90px; top:25%; animation-duration:70s; animation-delay:-15s;"></div>

            <div style="position:absolute; bottom:20%; left:5%; width:300px; height:200px; background:#8b4513; border:8px solid #000; cursor:pointer; z-index:10;" onclick="triggerAction('quest')">
                <div style="color:#00ffcc; text-align:center; padding:15px; font-weight:900; font-size:1.4em; text-shadow:0 0 10px #00ffcc;">U OČKA</div>
            </div>

            <div id="mmo-world-layer"></div>
        </div>
        
        <div class="sidebar-right">
            <h2 id="hero-display-name">Hrdina: ---</h2>
            
            <div class="stats-display">
                <div class="stat-item"><span>❤️ HP:</span> <span id="val-hp" class="stat-val">---</span></div>
                <div class="stat-item"><span>💪 SILA:</span> <span id="val-str" class="stat-val">---</span></div>
                <div class="stat-item"><span>💰 GOLDY:</span> <span id="val-gold" class="stat-val">---</span></div>
            </div>

            <div id="game-log">Systém: Pripájanie k Firebase MMO serveru...</div>

            <div class="chat-input-row">
                <input type="text" id="chat-msg-field" placeholder="Napíš správu všetkým..." onkeydown="if(event.key==='Enter') sendRealtimeChat()">
                <button class="btn-send-chat" onclick="sendRealtimeChat()">POSLAŤ</button>
            </div>
            
            <div class="pvp-module">
                <h3 style="color:#c0392b; text-align:center; margin-bottom:15px; font-weight:900; text-transform:uppercase;">⚔️ ARENA PvP</h3>
                <select id="victim-select" style="width:100%; padding:15px; border:5px solid #000; border-radius:18px; font-weight:bold; margin-bottom:15px; font-size:1.1em;">
                    <option value="">-- Vyber si obeť --</option>
                    <option value="Lubo">Lubo</option>
                    <option value="Karol">Karol</option>
                    <option value="Peter">Peter</option>
                </select>
                <button class="btn-attack-now" onclick="executeLootAttack()">ZAÚTOČIŤ NA HRÁČA!</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tvoja unikátna Firebase konfigurácia
        const firebaseConfig = {
            apiKey: "AIzaSyBco-l3gRLUA9y4aPmYuYnRT_gkZJGo4E",
            authDomain: "springfield-heroes.firebaseapp.com",
            projectId: "springfield-heroes",
            storageBucket: "springfield-heroes.firebasestorage.app",
            messagingSenderId: "601449864337",
            appId: "1:601449864337:web:d98c8e66c5f27e756e7330"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let localHero = { name: "", hp: 150, str: 15, gold: 100, x: 50, y: 50 };
        let movementLock = false;

        // --- 🔑 START MMO ---
        window.startMMOEngine = async function() {
            const userIn = document.getElementById('user-field').value;
            const passIn = document.getElementById('pass-field').value;
            const database = { "Lubo":"123Lubo", "Karol":"123Karol", "Peter":"123Peter" };

            if (database[userIn] && database[userIn] === passIn) {
                localHero.name = userIn;
                
                // 1. MMO REAL-TIME LISTENER (Sledovanie pohybu všetkých)
                onSnapshot(collection(db, "players"), (snap) => {
                    const world = document.getElementById('mmo-world-layer');
                    world.innerHTML = ''; // Reset pre prekreslenie

                    snap.forEach((pDoc) => {
                        const data = pDoc.data();
                        renderDynamicCharacter(data);
                        
                        if (data.name === localHero.name) {
                            if (!movementLock && data.gold < localHero.gold) pushToConsole(`🚨 ALERT: Bol si okradnutý o ${localHero.gold - data.gold} goldov!`);
                            localHero = data;
                            refreshInterface();
                        }
                    });
                });

                // 2. CHAT REAL-TIME LISTENER (Pre bublinky)
                const chatQuery = query(collection(db, "chat"), orderBy("time", "desc"), limit(25));
                onSnapshot(chatQuery, (chatSnap) => {
                    chatSnap.docChanges().reverse().forEach(change => {
                        if (change.type === "added") {
                            const msgData = change.doc.data();
                            pushToConsole(`[CHAT] ${msgData.user}: ${msgData.msg}`);
                            triggerSpeechBubble(msgData.user, msgData.msg);
                        }
                    });
                });

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('hero-display-name').innerText = "Hrdina: " + userIn;
            } else {
                document.getElementById('error-auth').style.display = 'block';
            }
        };

        // --- 🚶 MODUL: PLYNULÝ POHYB ---
        window.handleMapMovement = async function(e) {
            if (e.target.closest('.sidebar-right')) return;
            const viewport = document.getElementById('game-viewport');
            const rect = viewport.getBoundingClientRect();
            
            localHero.x = ((e.clientX - rect.left) / rect.width) * 100;
            localHero.y = ((e.clientY - rect.top) / rect.height) * 100;
            
            movementLock = true;
            await updateDoc(doc(db, "players", localHero.name), { x: localHero.x, y: localHero.y });
            setTimeout(() => movementLock = false, 1500);
        };

        function renderDynamicCharacter(p) {
            const world = document.getElementById('mmo-world-layer');
            const container = document.createElement('div');
            
            container.className = 'player-container';
            container.style.left = `calc(${p.x}% - 60px)`;
            container.style.top = `calc(${p.y}% - 140px)`;
            
            // Logika Vizuálu (Lubo = Ork, Karol = Elf)
            let characterHTML = '';
            if (p.name === 'Lubo') {
                characterHTML = `
                    <div class="speech-bubble" id="bubble-${p.name}"></div>
                    <div class="name-tag" style="border-color:#ff0000">${p.name}</div>
                    <div class="visual-orc-master">
                        <div class="orc-hair"></div>
                        <div class="orc-head">
                            <div class="orc-tusks"><div class="tusk"></div><div class="tusk"></div></div>
                        </div>
                        <div class="orc-shoulder s-left"></div>
                        <div class="orc-shoulder s-right"></div>
                        <div class="orc-body"></div>
                    </div>
                `;
            } else {
                characterHTML = `
                    <div class="speech-bubble" id="bubble-${p.name}"></div>
                    <div class="name-tag" style="border-color:#00ff00">${p.name}</div>
                    <div class="visual-elf-master">
                        <div class="elf-head"><div class="elf-ears"></div></div>
                        <div class="elf-body"></div>
                    </div>
                `;
            }
            
            container.innerHTML = characterHTML;
            world.appendChild(container);
        }

        // --- 💬 MODUL: BUBLINKOVÝ CHAT ---
        function triggerSpeechBubble(userName, message) {
            setTimeout(() => {
                const bubble = document.getElementById(`bubble-${userName}`);
                if (bubble) {
                    bubble.innerText = message;
                    bubble.classList.add('bubble-visible');
                    setTimeout(() => bubble.classList.remove('bubble-visible'), 5000);
                }
            }, 200);
        }

        window.sendRealtimeChat = async function() {
            const field = document.getElementById('chat-msg-field');
            if (!field.value.trim()) return;
            
            await addDoc(collection(db, "chat"), {
                user: localHero.name,
                msg: field.value,
                time: Date.now()
            });
            field.value = "";
        };

        // --- ⚔️ MODUL: PvP LOOT 10% ---
        window.executeLootAttack = async function() {
            const target = document.getElementById('victim-select').value;
            if (!target || target === localHero.name) return pushToConsole("❌ Vyber si obeť!");
            
            pushToConsole(`⚔️ Útočíš na ${target}...`);
            const tRef = doc(db, "players", target);
            const tSnap = await getDoc(tRef);
            
            if (tSnap.exists()) {
                const tData = tSnap.data();
                if ((localHero.str + Math.random()*30) > (tData.str + Math.random()*30)) {
                    let loot = Math.floor(tData.gold * 0.10);
                    if (loot < 1 && tData.gold > 0) loot = 1;

                    await updateDoc(tRef, { gold: tData.gold - loot });
                    localHero.gold += loot;
                    pushToConsole(`✅ VÍŤAZSTVO! Ukradol si ${loot}g hráčovi ${target}!`);
                    
                    movementLock = true;
                    await updateDoc(doc(db, "players", localHero.name), { gold: localHero.gold });
                    setTimeout(() => movementLock = false, 1000);
                } else {
                    pushToConsole(`💀 PREHRA! ${target} ťa zmlátil.`);
                }
            }
        };

        // --- 🏠 MODUL: AKCIE ---
        window.triggerAction = async function(type) {
            if (type === 'quest') {
                localHero.gold += 50;
                pushToConsole("🍺 Očko ti dal 50 goldov.");
            }
            movementLock = true;
            await updateDoc(doc(db, "players", localHero.name), localHero);
            setTimeout(() => movementLock = false, 1000);
        };

        function refreshInterface() {
            document.getElementById('val-hp').innerText = localHero.hp;
            document.getElementById('val-str').innerText = localHero.str;
            document.getElementById('val-gold').innerText = localHero.gold;
        }

        function pushToConsole(txt) {
            const box = document.getElementById('game-log');
            const d = new Date();
            const ts = d.getHours() + ":" + d.getMinutes().toString().padStart(2, '0');
            box.innerHTML += `[${ts}] > ${txt}<br>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
