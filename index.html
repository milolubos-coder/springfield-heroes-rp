<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title>Springfield Heroes - Ultra Dynamic MMO Edition</title>
    
    <style>
        /* ============================================================
           🎨 1. GLOBÁLNE CSS - ZÁKLADNÁ ARCHITEKTÚRA
           ============================================================ */
        * {
            box-sizing: border-box;
            outline: none;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #4facfe; 
            margin-top: 0px;
            margin-right: 0px;
            margin-bottom: 0px;
            margin-left: 0px;
            padding-top: 0px;
            padding-right: 0px;
            padding-bottom: 0px;
            padding-left: 0px;
            display: flex; 
            flex-direction: row;
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
            color: #222222;
        }

        /* ============================================================
           🔒 2. LOGIN MODUL (PRIHLASOVACIA OBRAZOVKA)
           ============================================================ */
        #login-screen { 
            position: fixed; 
            top: 0px; 
            left: 0px; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #ffd900 0%, #ffcc00 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 99999; 
        }

        .login-card { 
            background-color: #ffffff; 
            padding-top: 70px;
            padding-bottom: 70px;
            padding-left: 60px;
            padding-right: 60px;
            border-radius: 50px; 
            border-top-width: 12px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 12px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 12px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 12px;
            border-left-style: solid;
            border-left-color: #000000;
            text-align: center; 
            box-shadow: 0px 50px 120px rgba(0,0,0,0.6);
            width: 600px;
            max-width: 95%;
        }

        .login-card h1 { 
            font-size: 4em; 
            margin-bottom: 25px; 
            text-transform: uppercase; 
            letter-spacing: 6px;
            color: #000000;
            font-weight: 900;
        }

        .login-card p {
            font-size: 1.3em;
            color: #444444;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .login-card input { 
            padding-top: 22px;
            padding-bottom: 22px;
            padding-left: 20px;
            padding-right: 20px;
            margin-top: 15px;
            margin-bottom: 25px; 
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 6px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #000000;
            border-radius: 20px; 
            width: 100%; 
            display: block; 
            font-size: 1.5em;
            text-align: center;
            background-color: #f0f0f0;
        }

        .btn-start-game { 
            background-color: #000000; 
            color: #ffffff; 
            padding-top: 25px; 
            padding-bottom: 25px;
            border-top-style: none;
            border-right-style: none;
            border-bottom-style: none;
            border-left-style: none;
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: 900; 
            width: 100%; 
            font-size: 1.8em; 
            margin-top: 20px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-start-game:hover {
            transform: scale(1.06);
            background-color: #333333;
            box-shadow: 0px 15px 30px rgba(0,0,0,0.3);
        }

        /* ============================================================
           🗺️ 3. DYNAMICKÝ SVET - MAPA A OBJEKTY
           ============================================================ */
        #game-screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: row;
        }

        .world-map-area { 
            flex: 1; 
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E2FF 100%);
            position: relative; 
            overflow: hidden; 
            border-right-width: 15px;
            border-right-style: solid;
            border-right-color: #000000;
            cursor: crosshair;
        }

        /* ZEM A TRÁVA */
        .ground-base {
            position: absolute;
            bottom: 0px;
            left: 0px;
            width: 100%;
            height: 60%;
            background-color: #7ed321;
            z-index: 1;
            border-top-width: 8px;
            border-top-style: solid;
            border-top-color: #5ca316;
        }

        /* CESTA */
        .road-container {
            position: absolute;
            bottom: 15%;
            left: -5%;
            width: 110%;
            height: 150px;
            background-color: #333333;
            z-index: 2;
            transform: rotate(-1deg);
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #111111;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #111111;
        }

        .road-marking {
            position: absolute;
            top: 50%;
            left: 0px;
            width: 100%;
            height: 8px;
            background-image: repeating-linear-gradient(90deg, #ffffff, #ffffff 50px, transparent 50px, transparent 100px);
            margin-top: -4px;
        }

        /* ☁️ DYNAMICKÉ OBLAKY */
        .cloud-v3 {
            position: absolute; 
            background-color: #ffffff;
            border-radius: 100px; 
            filter: blur(8px); 
            z-index: 5;
            animation: moveClouds linear infinite;
        }

        .cloud-v3::before {
            content: '';
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            top: -50px;
            left: 20px;
        }

        .cloud-v3::after {
            content: '';
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            top: -60px;
            left: 70px;
        }

        @keyframes moveClouds {
            from { left: -400px; }
            to { left: 110%; }
        }

        /* 🏭 JADROVÁ ELEKTRÁREŇ (SEKTOR 7-G) */
        .power-plant-wrap {
            position: absolute;
            top: 10%;
            right: 8%;
            width: 380px;
            height: 280px;
            z-index: 15;
            cursor: pointer;
        }

        .pp-building-base {
            position: absolute;
            bottom: 0px;
            width: 100%;
            height: 180px;
            background-color: #999999;
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 6px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #000000;
        }

        .pp-cooling-tower {
            position: absolute;
            top: -140px;
            width: 100px;
            height: 160px;
            background-color: #cccccc;
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 6px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 0px;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #000000;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }

        .pp-smoke-effect {
            position: absolute;
            top: -180px;
            left: 20px;
            width: 60px;
            height: 60px;
            background-color: rgba(220, 220, 220, 0.8);
            border-radius: 50%;
            filter: blur(15px);
            animation: riseSmoke 4s infinite linear;
        }

        @keyframes riseSmoke {
            0% { transform: translateY(0px) scale(1); opacity: 0.9; }
            100% { transform: translateY(-250px) scale(5); opacity: 0; }
        }

        /* 🍺 HOSPODA U OČKA */
        .pub-container {
            position: absolute;
            bottom: 22%;
            left: 6%;
            width: 320px;
            height: 240px;
            z-index: 15;
            cursor: pointer;
        }

        .pub-facade {
            position: absolute;
            bottom: 0px;
            width: 100%;
            height: 200px;
            background-color: #8b4513;
            border-top-width: 8px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 8px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 8px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 8px;
            border-left-style: solid;
            border-left-color: #000000;
        }

        .pub-neon-text {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            color: #00ffdd;
            font-weight: 900;
            font-size: 1.6em;
            text-shadow: 0px 0px 15px #00ffdd;
            animation: flickerNeon 3s infinite;
        }

        @keyframes flickerNeon {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
            52% { opacity: 1; }
            54% { opacity: 0.4; }
            56% { opacity: 1; }
        }

        /* 🛒 KWIK-E-MART */
        .shop-building {
            position: absolute;
            top: 42%;
            left: 38%;
            width: 280px;
            height: 200px;
            z-index: 15;
            cursor: pointer;
        }

        .shop-wall {
            position: absolute;
            bottom: 0px;
            width: 100%;
            height: 160px;
            background-color: #ff4d4d;
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 6px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #000000;
        }

        .shop-header {
            position: absolute;
            top: 0px;
            width: 100%;
            height: 40px;
            background-color: #ffd900;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 1.2em;
        }

        /* 👤 MMO HRÁČI (AVATARY) */
        .mmo-character {
            position: absolute;
            width: 80px;
            height: 80px;
            z-index: 500;
            transition-property: left, top;
            transition-duration: 1.1s;
            transition-timing-function: cubic-bezier(0.1, 0.7, 0.1, 1);
            pointer-events: none;
        }

        .character-visual {
            width: 100%;
            height: 100%;
            background-image: url('barbar.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            filter: drop-shadow(0px 15px 10px rgba(0,0,0,0.4));
        }

        .character-tag {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.9);
            color: #ffffff;
            padding-top: 6px;
            padding-bottom: 6px;
            padding-left: 15px;
            padding-right: 15px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px;
            white-space: nowrap;
            border-top-width: 3px;
            border-top-style: solid;
            border-top-color: #ffd900;
            border-right-width: 3px;
            border-right-style: solid;
            border-right-color: #ffd900;
            border-bottom-width: 3px;
            border-bottom-style: solid;
            border-bottom-color: #ffd900;
            border-left-width: 3px;
            border-left-style: solid;
            border-left-color: #ffd900;
        }

        /* 🚌 DOPRAVA */
        .springfield-bus {
            position: absolute;
            bottom: 20%;
            width: 140px;
            height: 70px;
            background-color: #f1c40f;
            border-top-width: 5px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 5px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 5px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 5px;
            border-left-style: solid;
            border-left-color: #000000;
            border-radius: 12px;
            z-index: 60;
            animation: busDrive 18s linear infinite;
        }

        @keyframes busDrive {
            from { left: -250px; }
            to { left: 115%; }
        }

        /* ============================================================
           🖥️ 4. SIDEBAR - OVLÁDANIE A STATS
           ============================================================ */
        .game-panel { 
            width: 460px; 
            background-color: #ffffff; 
            padding-top: 30px;
            padding-right: 35px;
            padding-bottom: 30px;
            padding-left: 35px;
            display: flex; 
            flex-direction: column; 
            box-shadow: -25px 0px 70px rgba(0,0,0,0.5); 
            overflow-y: auto;
            z-index: 1000;
        }

        .game-panel h2 { 
            font-size: 2.8em; 
            text-align: center;
            border-bottom-width: 8px;
            border-bottom-style: solid;
            border-bottom-color: #ffd900;
            padding-bottom: 12px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .hero-stats-card { 
            background-color: #f8f8f8; 
            padding-top: 25px;
            padding-right: 25px;
            padding-bottom: 25px;
            padding-left: 25px;
            border-radius: 35px; 
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 6px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #000000;
            margin-bottom: 35px; 
        }

        .stat-display-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 1.8em; 
            font-weight: 900; 
            margin-top: 15px; 
            margin-bottom: 15px; 
        }

        .stat-name { color: #555555; }
        .stat-count { color: #008cff; }

        /* DENNÍK A CHAT */
        #game-live-console { 
            background-color: #111111; 
            color: #00ff00; 
            padding-top: 20px;
            padding-right: 20px;
            padding-bottom: 20px;
            padding-left: 20px;
            height: 350px; 
            overflow-y: auto; 
            font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 16px; 
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 6px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #000000;
            border-radius: 20px;
            margin-bottom: 25px;
            line-height: 1.8;
            box-shadow: inset 0px 0px 25px #000000;
        }

        .chat-interaction-box { 
            display: flex; 
            gap: 15px; 
        }

        .chat-interaction-box input { 
            flex: 1; 
            padding-top: 18px;
            padding-right: 18px;
            padding-bottom: 18px;
            padding-left: 18px;
            border-top-width: 5px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 5px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 5px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 5px;
            border-left-style: solid;
            border-left-color: #000000;
            border-radius: 15px; 
            font-size: 1.1em;
        }

        .btn-post-chat { 
            background-color: #000000; 
            color: #ffffff; 
            border-top-style: none;
            border-right-style: none;
            border-bottom-style: none;
            border-left-style: none;
            padding-left: 25px;
            padding-right: 25px;
            border-radius: 15px; 
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* PvP ARENA */
        .arena-master-panel {
            background-color: #ffe8e8;
            padding-top: 25px;
            padding-right: 25px;
            padding-bottom: 25px;
            padding-left: 25px;
            border-radius: 30px;
            border-top-width: 6px;
            border-top-style: solid;
            border-top-color: #c0392b;
            border-right-width: 6px;
            border-right-style: solid;
            border-right-color: #c0392b;
            border-bottom-width: 6px;
            border-bottom-style: solid;
            border-bottom-color: #c0392b;
            border-left-width: 6px;
            border-left-style: solid;
            border-left-color: #c0392b;
            margin-top: 20px;
        }

        .arena-master-panel h3 {
            color: #c0392b;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.6em;
        }

        .btn-arena-fight {
            width: 100%;
            padding-top: 20px;
            padding-bottom: 20px;
            background-color: #c0392b;
            color: #ffffff;
            border-top-width: 5px;
            border-top-style: solid;
            border-top-color: #000000;
            border-right-width: 5px;
            border-right-style: solid;
            border-right-color: #000000;
            border-bottom-width: 5px;
            border-bottom-style: solid;
            border-bottom-color: #000000;
            border-left-width: 5px;
            border-left-style: solid;
            border-left-color: #000000;
            border-radius: 18px;
            font-weight: 900;
            font-size: 1.3em;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1>Springfield Heroes</h1>
            <p>Prihlás sa do cloudu a bojuj o nadvládu v meste!</p>
            
            <input type="text" id="auth-user" placeholder="Meno hrdinu (Lubo, Karol, Peter)">
            <input type="password" id="auth-pass" placeholder="Tvoje tajné heslo">
            
            <button class="btn-start-game" onclick="processAuth()">VSTÚPIŤ DO HRY</button>
            
            <p id="auth-error-msg" style="color:red; display:none; margin-top:25px; font-weight:900;">❌ Údaje nie sú správne!</p>
        </div>
    </div>

    <div id="game-screen">
        
        <div class="world-map-area" id="map-viewport" onclick="dispatchMovement(event)">
            <div class="ground-base"></div>
            
            <div class="road-container">
                <div class="road-marking"></div>
            </div>

            <div class="cloud-v3" style="width:220px; height:70px; top:5%; animation-duration:40s;"></div>
            <div class="cloud-v3" style="width:300px; height:90px; top:25%; animation-duration:70s; animation-delay:-10s;"></div>
            <div class="cloud-v3" style="width:180px; height:50px; top:12%; animation-duration:55s; animation-delay:-25s;"></div>

            <div class="pub-container" onclick="handleLocation('quest')">
                <div class="pub-facade">
                    <div class="pub-neon-text">U SMÄDNÉHO MEDVEĎA</div>
                </div>
            </div>

            <div class="power-plant-wrap" onclick="handleLocation('train')">
                <div class="pp-cooling-tower tower-1">
                    <div class="pp-smoke-effect"></div>
                    <div class="pp-smoke-effect" style="animation-delay:2s;"></div>
                </div>
                <div class="pp-cooling-tower tower-2">
                    <div class="pp-smoke-effect" style="animation-delay:1s;"></div>
                </div>
                <div class="pp-building-base">
                    <div style="color:white; text-align:center; padding:20px; font-weight:900; font-size:1.4em;">SEKTOR 7-G</div>
                </div>
            </div>

            <div class="shop-building" onclick="handleLocation('shop')">
                <div class="shop-wall">
                    <div class="shop-header">KWIK-E-MART</div>
                </div>
            </div>

            <div class="springfield-bus"></div>

            <div id="mmo-characters-layer"></div>
        </div>

        <div class="game-panel">
            <h2 id="current-hero-label">Hrdina: ---</h2>
            
            <div class="hero-stats-card">
                <div class="stat-display-row">
                    <span class="stat-name">❤️ HP (Zdravie):</span> 
                    <span id="label-hp" class="stat-count">---</span>
                </div>
                <div class="stat-display-row">
                    <span class="stat-name">💪 Sila Boja:</span> 
                    <span id="label-str" class="stat-count">---</span>
                </div>
                <div class="stat-display-row">
                    <span class="stat-name">💰 Zlaté Goldy:</span> 
                    <span id="label-gold" class="stat-count">---</span>
                </div>
            </div>

            <div id="game-live-console">Systém: Pripájanie k Firebase...</div>

            <div class="chat-interaction-box">
                <input type="text" id="chat-input-msg" placeholder="Napíš správu všetkým..." onkeydown="if(event.key==='Enter') executeChatSend()">
                <button class="btn-post-chat" onclick="executeChatSend()">POSLAŤ</button>
            </div>

            <div class="arena-master-panel">
                <h3>⚔️ ARENA PvP (Loot 1-10%)</h3>
                <select id="victim-select-box" style="width:100%; padding:15px; border:4px solid #000; border-radius:15px; font-weight:bold; margin-bottom:20px; font-size:1.1em;">
                    <option value="">-- Vyber si obeť --</option>
                    <option value="Lubo">Lubo</option>
                    <option value="Karol">Karol</option>
                    <option value="Peter">Peter</option>
                </select>
                <button class="btn-arena-fight" onclick="dispatchPvPAction()">ZAÚTOČIŤ NA HRÁČA!</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            onSnapshot, 
            collection, 
            addDoc, 
            query, 
            orderBy, 
            limit 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBco-l3gRLUA9y4aPmYuYnRT_gkZJGo4E",
            authDomain: "springfield-heroes.firebaseapp.com",
            projectId: "springfield-heroes",
            storageBucket: "springfield-heroes.firebasestorage.app",
            messagingSenderId: "601449864337",
            appId: "1:601449864337:web:d98c8e66c5f27e756e7330"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let hero = { 
            name: "", 
            hp: 150, 
            str: 15, 
            gold: 100, 
            x: 50, 
            y: 50 
        };
        
        let localLock = false;

        // --- 🔑 AUTH ---
        window.processAuth = async function() {
            const uInput = document.getElementById('auth-user').value;
            const pInput = document.getElementById('auth-pass').value;
            const validAccs = { 
                "Lubo":"123Lubo", 
                "Karol":"123Karol", 
                "Peter":"123Peter" 
            };

            if (validAccs[uInput] && validAccs[uInput] === pInput) {
                hero.name = uInput;
                
                // Real-time MMO Listener
                onSnapshot(collection(db, "players"), (snap) => {
                    const l = document.getElementById('mmo-characters-layer');
                    l.innerHTML = '';
                    snap.forEach(d => {
                        const data = d.data();
                        renderCharacter(data);
                        if (data.name === hero.name) {
                            if (!localLock && data.gold < hero.gold) pushToConsole(`🚨 ALERT: Bol si okradnutý o ${hero.gold - data.gold} goldov!`);
                            hero = data;
                            refreshInterface();
                        }
                    });
                });

                // Real-time Chat Listener
                const qMsg = query(collection(db, "chat"), orderBy("time", "desc"), limit(30));
                onSnapshot(qMsg, s => {
                    s.docChanges().reverse().forEach(c => {
                        if (c.type === "added") pushToConsole(`[CHAT] ${c.doc.data().user}: ${c.doc.data().msg}`);
                    });
                });

                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                document.getElementById('current-hero-label').innerText = "Hrdina: " + uInput;
                pushToConsole(`Vitaj v Springfielde, ${uInput}! Klikni na mapu pre pohyb.`);
            } else {
                document.getElementById('auth-error-msg').style.display = 'block';
            }
        };

        // --- 🚶 POHYB ---
        window.dispatchMovement = async function(e) {
            if (e.target.closest('.game-panel')) return;
            const viewport = document.getElementById('map-viewport');
            const rect = viewport.getBoundingClientRect();
            
            hero.x = ((e.clientX - rect.left) / rect.width) * 100;
            hero.y = ((e.clientY - rect.top) / rect.height) * 100;
            
            localLock = true;
            await updateDoc(doc(db, "players", hero.name), { 
                x: hero.x, 
                y: hero.y 
            });
            setTimeout(() => { localLock = false; }, 800);
        };

        function renderCharacter(p) {
            const l = document.getElementById('mmo-characters-layer');
            const div = document.createElement('div');
            div.className = 'mmo-character';
            div.style.left = `calc(${p.x}% - 40px)`;
            div.style.top = `calc(${p.y}% - 40px)`;
            div.innerHTML = `<div class="character-tag">${p.name}</div><div class="character-visual"></div>`;
            l.appendChild(div);
        }

        // --- 🏠 AKCIE ---
        window.handleLocation = async function(type) {
            if (type === 'quest') { 
                hero.gold += 50; 
                pushToConsole("Hospoda u Očka: Zarobil si 50 goldov."); 
            }
            if (type === 'train') { 
                if(hero.gold >= 10) { 
                    hero.gold -= 10; 
                    hero.str += 2; 
                    pushToConsole("Elektráreň: Tvoja sila vzrástla o 2!"); 
                }
                else pushToConsole("❌ Nemáš dosť goldov na tréning.");
            }
            if (type === 'shop') {
                if(hero.gold >= 150) { 
                    hero.gold -= 150; 
                    hero.hp += 50; 
                    pushToConsole("Kwik-E-Mart: Brnenie kúpené. HP +50."); 
                }
                else pushToConsole("❌ Apu: 'Na toto nemáš goldy, pane!'");
            }
            localLock = true;
            await updateDoc(doc(db, "players", hero.name), hero);
            setTimeout(() => { localLock = false; }, 1000);
        };

        // --- ⚔️ PvP (LOOT 1-10%) ---
        window.dispatchPvPAction = async function() {
            const target = document.getElementById('victim-select-box').value;
            if(!target || target === hero.name) {
                pushToConsole("❌ Vyber si platnú obeť súboja!");
                return;
            }
            
            pushToConsole(`⚔️ Vstupuješ do súboja s hráčom ${target}...`);
            const tRef = doc(db, "players", target);
            const tSnap = await getDoc(tRef);
            
            if(tSnap.exists()) {
                let tData = tSnap.data();
                if((hero.str + Math.random()*30) > (tData.str + Math.random()*30)) {
                    // Výpočet lúpeže (1-10%)
                    let lootFactor = (Math.floor(Math.random() * 10) + 1) / 100;
                    let stolen = Math.floor(tData.gold * lootFactor);
                    if(stolen < 1 && tData.gold > 0) stolen = 1;

                    await updateDoc(tRef, { gold: tData.gold - stolen });
                    hero.gold += stolen;
                    
                    pushToConsole(`✅ VÍŤAZSTVO! Ukradol si ${stolen} goldov (${Math.round(lootFactor*100)}% lupu).`);
                    
                    localLock = true;
                    await updateDoc(doc(db, "players", hero.name), { gold: hero.gold });
                    setTimeout(() => { localLock = false; }, 1000);
                } else {
                    pushToConsole(`💀 PORÁŽKA! Hráč ${target} bol silnejší.`);
                }
            } else {
                pushToConsole("❌ Súper nebol nájdený v databáze.");
            }
        };

        // --- 💬 CHAT ---
        window.executeChatSend = async () => {
            const field = document.getElementById('chat-input-msg');
            const message = field.value.trim();
            if (!message) return;
            
            await addDoc(collection(db, "chat"), { 
                user: hero.name, 
                msg: message, 
                time: Date.now() 
            });
            field.value = "";
        };

        function refreshInterface() {
            document.getElementById('label-hp').innerText = hero.hp;
            document.getElementById('label-str').innerText = hero.str;
            document.getElementById('label-gold').innerText = hero.gold;
        }

        function pushToConsole(m) {
            const b = document.getElementById('game-live-console');
            const d = new Date();
            const time = d.getHours() + ":" + d.getMinutes().toString().padStart(2, '0');
            b.innerHTML += `[${time}] > ${m}<br>`;
            b.scrollTop = b.scrollHeight;
        }
    </script>
</body>
</html>
