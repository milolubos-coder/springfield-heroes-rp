<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >
    <title>Springfield Heroes RPG - Master Edition</title>
    
    <style>
        /* =========================================
           🎨 ZÁKLADNÉ NASTAVENIA STRÁNKY
           ========================================= */
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffd900; 
            margin: 0; 
            padding: 0;
            display: flex; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden; 
        }

        /* =========================================
           🔒 LOGIN SYSTÉM (PRIHLÁSENIE)
           ========================================= */
        #login-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #ffd900; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
        }

        .login-box { 
            background-color: #ffffff; 
            padding: 50px; 
            border-radius: 30px; 
            border: 8px solid #000000; 
            text-align: center; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            max-width: 450px;
            width: 90%;
        }

        .login-box h1 { 
            font-size: 2.8em; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            color: #000;
        }

        .login-box p {
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
        }

        .login-box input { 
            padding: 15px; 
            margin: 10px 0; 
            border: 4px solid #333333; 
            border-radius: 12px; 
            width: 100%; 
            display: block; 
            font-size: 1.2em;
            outline: none;
        }

        .btn-login { 
            background-color: #000000; 
            color: #ffffff; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            font-size: 1.3em; 
            margin-top: 15px;
            transition: background 0.3s;
        }

        .btn-login:hover {
            background-color: #333;
        }

        #error-msg { 
            color: #ff0000; 
            display: none; 
            font-weight: bold; 
            margin-top: 15px; 
        }

        /* =========================================
           🗺️ MAPA A ANIMÁCIA OBLAKOV
           ========================================= */
        #game-screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
        }

        .map-container { 
            flex: 1; 
            background-image: url('mesto.png'); 
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover; 
            border-right: 8px solid #000000; 
            position: relative; 
            overflow: hidden; 
        }

        /* ☁️ CLOUD CSS SYSTEM */
        .cloud {
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 100px; 
            pointer-events: none; 
            filter: blur(5px);
            width: 160px;
            height: 50px;
        }

        .cloud::before, .cloud::after {
            content: ''; 
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.9); 
            border-radius: 50%;
        }

        .cloud::before { 
            width: 80px; 
            height: 80px; 
            top: -40px; 
            left: 20px; 
        }

        .cloud::after { 
            width: 100px; 
            height: 100px; 
            top: -50px; 
            left: 60px; 
        }

        /* Konkrétne mraky s rôznymi parametrami */
        .c1 { top: 8%; animation: moveCloud 30s linear infinite; opacity: 0.8; }
        .c2 { top: 22%; animation: moveCloud 50s linear infinite; animation-delay: -5s; opacity: 0.6; transform: scale(1.4); }
        .c3 { top: 5%; animation: moveCloud 42s linear infinite; animation-delay: -15s; opacity: 0.4; transform: scale(0.9); }
        .c4 { top: 30%; animation: moveCloud 65s linear infinite; animation-delay: -10s; opacity: 0.7; transform: scale(1.1); }
        .c5 { top: 15%; animation: moveCloud 38s linear infinite; animation-delay: -25s; opacity: 0.5; }
        .c6 { top: 40%; animation: moveCloud 75s linear infinite; animation-delay: -2s; opacity: 0.6; transform: scale(1.6); }

        @keyframes moveCloud {
            from { left: -300px; }
            to { left: 100%; }
        }

        /* =========================================
           🖥️ SIDEBAR (OVLÁDACÍ PANEL)
           ========================================= */
        .sidebar { 
            width: 400px; 
            background-color: #ffffff; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: -15px 0 40px rgba(0,0,0,0.4); 
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h2 { 
            margin-top: 0; 
            font-size: 2em;
            color: #000;
            border-bottom: 4px solid #ffd900;
            padding-bottom: 10px;
        }

        /* 📊 ŠTATISTIKY PANEL */
        .stats-panel { 
            background-color: #f7f7f7; 
            padding: 20px; 
            border-radius: 20px; 
            border: 4px solid #333333; 
            margin-bottom: 30px; 
        }

        .stat-line { 
            display: flex; 
            justify-content: space-between; 
            font-size: 1.5em; 
            font-weight: bold; 
            margin: 8px 0; 
        }

        .label { color: #555; }
        .value { color: #008cff; }

        /* 🕹️ AKČNÉ TLAČIDLÁ */
        .action-group {
            margin-bottom: 20px;
        }

        .action-group h3 { 
            margin: 10px 0; 
            font-size: 1.3em;
            color: #333;
            text-transform: uppercase;
        }

        button.game-btn { 
            background-color: #008cff; 
            color: #ffffff; 
            border: 4px solid #000000; 
            padding: 16px; 
            border-radius: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-bottom: 12px; 
            font-size: 1.1em;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button.game-btn:hover { 
            background-color: #005fbb; 
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button.game-btn:active {
            transform: translateY(0px);
        }

        .btn-kwik { background-color: #28a745 !important; }
        .btn-kwik:hover { background-color: #218838 !important; }

        /* ⚔️ PVP ARENA PANEL */
        .arena-box { 
            background-color: #ffe5e5; 
            padding: 20px; 
            border-radius: 20px; 
            border: 4px solid #c00000; 
            margin-top: 10px; 
        }

        .arena-box h3 { 
            color: #c00000; 
            margin-top: 0; 
            font-size: 1.4em;
        }

        .arena-box select { 
            width: 100%; 
            padding: 14px; 
            border: 3px solid #000000; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            font-weight: bold; 
            font-size: 1.1em;
            background-color: #fff;
        }

        .btn-attack { 
            background-color: #c00000 !important; 
            color: #fff !important;
        }

        .btn-attack:hover { 
            background-color: #a00000 !important; 
        }

        /* 📜 LOGOVACIA KONZOLA */
        #game-log { 
            background-color: #222222; 
            color: #00ff00; 
            padding: 15px; 
            height: 220px; 
            overflow-y: auto; 
            font-family: 'Courier New', monospace; 
            font-size: 14px; 
            margin-top: auto; 
            border: 4px solid #000000; 
            border-radius: 15px;
            line-height: 1.5;
            box-shadow: inset 0 0 10px #000;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Springfield RPG</h1>
            <p>Prihlás sa a hraj v reálnom čase</p>
            
            <input type="text" id="username" placeholder="Meno (Lubo, Karol, Peter)">
            <input type="password" id="password" placeholder="Heslo">
            
            <button class="btn-login" onclick="checkLogin()">VSTÚPIŤ DO HRY</button>
            
            <p id="error-msg">❌ Nesprávne meno alebo heslo!</p>
        </div>
    </div>

    <div id="game-screen">
        <div class="map-container">
            <div class="cloud c1"></div>
            <div class="cloud c2"></div>
            <div class="cloud c3"></div>
            <div class="cloud c4"></div>
            <div class="cloud c5"></div>
            <div class="cloud c6"></div>
        </div>
        
        <div class="sidebar">
            <h2 id="hero-name-label">Hrdina: ---</h2>
            
            <div class="stats-panel">
                <div class="stat-line">
                    <span class="label">❤️ HP (Život):</span> 
                    <span id="hp" class="value">---</span>
                </div>
                <div class="stat-line">
                    <span class="label">💪 Sila:</span> 
                    <span id="str" class="value">---</span>
                </div>
                <div class="stat-line">
                    <span class="label">💰 Goldy:</span> 
                    <span id="gold" class="value">---</span>
                </div>
            </div>

            <div class="action-group">
                <h3>📍 Lokality v meste</h3>
                
                <button class="game-btn" onclick="playQuest()">
                    🍺 Hospoda u Očka (Quest +50g)
                </button>
                
                <button class="game-btn" onclick="train()">
                    🏗️ Jadrová elektráreň (+2 Sila / -10g)
                </button>
                
                <button class="game-btn btn-kwik" onclick="buyArmor()">
                    🛒 Kwik-E-Mart (+50 HP / -150g)
                </button>
                
                <div class="arena-box">
                    <h3>⚔️ Aréna (Súboj o loot)</h3>
                    <select id="target-player">
                        <option value="">-- Vyber si obeť --</option>
                        <option value="Lubo">Lubo</option>
                        <option value="Karol">Karol</option>
                        <option value="Peter">Peter</option>
                    </select>
                    <button class="game-btn btn-attack" onclick="pvpAttack()">
                        ZAÚTOČIŤ NA SÚPERA!
                    </button>
                </div>
            </div>

            <div id="game-log">Systém: Pripravený na pripojenie...</div>
        </div>
    </div>

    <script type="module">
        // Import Firebase knižníc z oficiálneho zdroja (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Tvoja unikátna konfigurácia (Firebase Project Settings)
        const firebaseConfig = {
            apiKey: "AIzaSyBco-l3gRLUA9y4aPmYuYnRT_gkZJGo4E",
            authDomain: "springfield-heroes.firebaseapp.com",
            projectId: "springfield-heroes",
            storageBucket: "springfield-heroes.firebasestorage.app",
            messagingSenderId: "601449864337",
            appId: "1:601449864337:web:d98c8e66c5f27e756e7330"
        };

        // Inicializácia Firebase a Databázy
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lokálna premenná pre dáta hrdinu
        let hero = { 
            name: "", 
            hp: 150, 
            str: 15, 
            gold: 100 
        };

        // Ochranný mechanizmus pred notifikáciami pri vlastných zmenách
        let isLocalUpdate = false;

        // 🔑 FUNKCIA PRIHLÁSENIA A AKTIVÁCIE REAL-TIME SYNCU
        window.checkLogin = async function() {
            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;
            
            // Definované účty
            const validAccounts = { 
                "Lubo": "123Lubo", 
                "Karol": "123Karol", 
                "Peter": "123Peter" 
            };

            if (validAccounts[userIn] && validAccounts[userIn] === passIn) {
                hero.name = userIn;
                
                // --- REAL-TIME CLOUD LISTENER (Kľúčová časť pre real-time) ---
                const playerDocRef = doc(db, "players", userIn);
                
                onSnapshot(playerDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const incomingData = snapshot.data();
                        
                        // Detekcia krádeže: ak v databáze klesli goldy a nebola to naša akcia
                        if (!isLocalUpdate && incomingData.gold < hero.gold) {
                            const lootAmount = hero.gold - incomingData.gold;
                            writeToLog(`🚨 VAROVANIE: Bol si okradnutý o ${lootAmount} goldov!`);
                        }
                        
                        // Aktualizácia lokálnych dát
                        hero = incomingData;
                        updateInterface();
                    } else {
                        // Ak hráč v cloude ešte nie je (prvé prihlásenie)
                        createNewCloudAccount(userIn);
                    }
                });

                // Prepneme obrazovky
                document.getElementById('hero-name-label').innerText = "Hrdina: " + userIn;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                
                writeToLog(`Úspešné prihlásenie. Hrdina ${userIn} vstúpil do Springfieldu.`);
            } else {
                // Zobrazenie chyby
                document.getElementById('error-msg').style.display = 'block';
            }
        };

        // Vytvorenie nového hráča v databáze
        async function createNewCloudAccount(name) {
            const initialData = { 
                name: name, 
                hp: 150, 
                str: 15, 
                gold: 100 
            };
            await setDoc(doc(db, "players", name), initialData);
            writeToLog("Vytvorený nový herný profil v cloude.");
        }

        // 💾 FUNKCIA SYNCHRONIZÁCIE S CLOUDOM
        async function sendToCloud() {
            if (!hero.name) return;
            
            isLocalUpdate = true; // Zastavíme notifikáciu o "krádeži"
            const docRef = doc(db, "players", hero.name);
            
            try {
                await updateDoc(docRef, hero);
            } catch (e) {
                console.error("Chyba pri ukladaní:", e);
            }
            
            // Po krátkej dobe opäť zapneme stráženie zmien z cloudu
            setTimeout(() => { 
                isLocalUpdate = false; 
            }, 1000);
        }

        // 🍺 AKCIA: QUEST V HOSPODE
        window.playQuest = function() {
            hero.gold += 50;
            writeToLog("🍺 Quest u Očka splnený! Zarobil si 50 goldov.");
            updateInterface();
            sendToCloud();
        };

        // 🏗️ AKCIA: TRÉNING V ELEKTRÁRNI
        window.train = function() {
            if (hero.gold >= 10) {
                hero.gold -= 10;
                hero.str += 2;
                writeToLog("🏗️ Tréning v elektrárni dokončený. Sila +2.");
                updateInterface();
                sendToCloud();
            } else {
                writeToLog("❌ Nemáš dosť goldov (10) na tréning!");
            }
        };

        // 🛒 AKCIA: NÁKUP BRNENIA V KWIK-E-MART
        window.buyArmor = function() {
            if (hero.gold >= 150) {
                hero.gold -= 150;
                hero.hp += 50;
                writeToLog("🛡️ Kúpil si si brnenie u Apuho. HP vzrástlo o 50.");
                updateInterface();
                sendToCloud();
            } else {
                writeToLog("❌ Apu: 'Neskúšaj to na mňa! Potrebuješ 150 goldov.'");
            }
        };

        // ⚔️ AKCIA: PVP SÚBOJ V ARÉNE
        window.pvpAttack = async function() {
            const targetName = document.getElementById('target-player').value;

            if (!targetName || targetName === hero.name) {
                writeToLog("❌ Vyber si platného súpera zo zoznamu!");
                return;
            }

            writeToLog(`⚔️ Vstupuješ do súboja proti hráčovi ${targetName}...`);

            const targetDocRef = doc(db, "players", targetName);
            const targetSnapshot = await getDoc(targetDocRef);

            if (targetSnapshot.exists()) {
                let targetData = targetSnapshot.data();
                
                // Výpočet bojovej sily (Sila hrdinu + náhoda 1-20)
                let myPower = hero.str + Math.floor(Math.random() * 20);
                let enemyPower = targetData.str + Math.floor(Math.random() * 20);

                if (myPower > enemyPower) {
                    // VÝHRA! Náhodný loot 1% až 10%
                    let lootPercentage = (Math.floor(Math.random() * 10) + 1) / 100;
                    let stolenGold = Math.floor(targetData.gold * lootPercentage);
                    
                    if (stolenGold < 1 && targetData.gold > 0) stolenGold = 1;

                    // 1. Update súpera v cloude (strata goldov)
                    await updateDoc(targetDocRef, { 
                        gold: targetData.gold - stolenGold 
                    });
                    
                    // 2. Update seba (zisk goldov)
                    hero.gold += stolenGold;
                    writeToLog(`✅ VÍŤAZSTVO! Okradol si ${targetName} o ${stolenGold} goldov.`);
                    
                    updateInterface();
                    sendToCloud();
                } else {
                    // PREHRA
                    writeToLog(`💀 PREHRA! Hráč ${targetName} bol v súboji silnejší.`);
                }
            } else {
                writeToLog("❌ Súper zatiaľ neexistuje v databáze (nebol prihlásený).");
            }
        };

        // ⚙️ POMOCNÉ FUNKCIE PRE UI
        function updateInterface() {
            document.getElementById('hp').innerText = hero.hp;
            document.getElementById('str').innerText = hero.str;
            document.getElementById('gold').innerText = hero.gold;
        }

        function writeToLog(msg) {
            const logBox = document.getElementById('game-log');
            const now = new Date();
            const timeStr = now.getHours() + ":" + now.getMinutes().toString().padStart(2, '0');
            
            // Pridanie správy do konzoly
            logBox.innerHTML += `[${timeStr}] > ${msg}<br>`;
            
            // Automatický scroll na spodok konzoly
            logBox.scrollTop = logBox.scrollHeight;
        }
    </script>
</body>
</html>
